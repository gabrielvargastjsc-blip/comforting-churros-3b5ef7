name: MeuTreino
options:
  bundleIdPrefix: com.meutreino
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    INFOPLIST_KEY_CFBundleDisplayName: "Meu Treino"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  MeuTreino:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meutreino.app
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
