/* ============================================================ VALE DOPAMINÉRGICO + PROJEÇÃO DE EFEITOS ============================================================ */
const ONSET_DA=0.5;
function nowH(){ const n=new Date(); return n.getHours()+n.getMinutes()/60; }
function median(a){ if(!a||!a.length) return null; const s=a.slice().sort((x,y)=>x-y),n=s.length; return n%2?s[(n-1)/2]:Math.round((s[n/2-1]+s[n/2])/2); }
function rawOnsetOffset(date){ const start=dayStartMin(date); for(let m=0;m<=600;m+=5){ if(ntLevel(date,"DA",(start+m)/60)>=ONSET_DA) return m; } return 45; }
function rawPeakOffset(date){ const start=dayStartMin(date); let best=0,bv=-1; for(let m=0;m<=600;m+=5){ const t=(start+m)/60,v=ntLevel(date,"DA",t)+0.6*ntLevel(date,"NA",t); if(v>bv){bv=v;best=m;} } return best; }
function effOffset(type,date){ const raw=type==="onset"?rawOnsetOffset(date):rawPeakOffset(date); const logs=(State.sympLog[type]||[]); const all=(raw==null?[]:[raw]).concat(logs); const m=median(all); return m==null?raw:m; }
function onsetMin(date){ return dayStartMin(date)+effOffset("onset",date); }
function peakMin(date){ return dayStartMin(date)+effOffset("peak",date); }
function improveOffset(date){ const pk=peakMin(date); const naPk=ntLevel(date,"NA",pk/60); if(naPk<NA_RISCO_LIMIAR){ const lim=ntLevel(date,"DA",pk/60)*0.7; for(let m=5;m<=600;m+=5){ if(ntLevel(date,"DA",(pk+m)/60)<lim) return m; } return null; } for(let m=5;m<=600;m+=5){ if(ntLevel(date,"NA",(pk+m)/60)<NA_RISCO_LIMIAR) return m; } return null; }
function projHTML(date){ const st=dayStartMin(date), oMin=onsetMin(date), pMin=peakMin(date); return `<div class="proj" id="proj"><div class="pj"><span class="pj-dot" style="background:var(--slate)"></span><div><div class="pj-l">Dose</div><div class="pj-t mono">${hhmm(st)}</div></div></div><div class="pj"><span class="pj-dot" style="background:var(--accent)"></span><div><div class="pj-l">Efeitos</div><div class="pj-t mono">${hhmm(oMin)}</div></div></div><div class="pj"><span class="pj-dot" style="background:var(--warn)"></span><div><div class="pj-l">Pico</div><div class="pj-t mono">${hhmm(pMin)}</div></div></div></div>`; }

/* contribuição por medicamento + crashes (dopamina) */
function medNTLevel(date, medId, ntKey, tH){ let s=0; dosesForDay(date).forEach(d=>{ if(d.med.id!==medId) return;
  if(d.med.bicModel){ if(d.doseIndex===0) s += bicEffContrib(d.med, ntKey, tH, dayStartMin(date)/60); return; }
  if(!d.med.efeitos) return; const t0=d.min/60; d.med.efeitos.forEach(e=>{ if(e.nt===ntKey) s+=d.mult*bateman(tH,t0,e.mag,e.ka,e.ke); }); }); return s; }
function medsForNT(date, ntKey){ const ids=[]; dosesForDay(date).forEach(d=>{ if(d.med.efeitos && d.med.efeitos.some(e=>e.nt===ntKey) && !ids.includes(d.med.id)) ids.push(d.med.id); }); return ids.map(id=>find(id)); }
function daPeakOffset(date){ const start=dayStartMin(date); let best=0,bv=-1; for(let m=0;m<=600;m+=5){ const v=ntLevel(date,"DA",(start+m)/60); if(v>bv){bv=v;best=m;} } return best; }
function crashVespOffset(date){ const start=dayStartMin(date); let prevV=ntLevel(date,"DA",(start+120)/60), prevM=120, dec=false; for(let m=125;m<=600;m+=5){ const v=ntLevel(date,"DA",(start+m)/60); if(v<prevV-1e-4){ dec=true; } else if(v>prevV+1e-4 && dec){ return prevM; } prevV=v; prevM=m; } let bm=540,bv=1e9; for(let m=360;m<=600;m+=5){ const v=ntLevel(date,"DA",(start+m)/60); if(v<bv){bv=v;bm=m;} } return bm; }
function crashNoctOffset(date){ const start=dayStartMin(date), lim=NT.DA.base*0.9, maxM=1440-start; for(let m=540;m<=maxM;m+=5){ if(ntLevel(date,"DA",(start+m)/60)<lim) return m; } let best=720,bv=1e9; for(let m=540;m<=Math.min(960,maxM);m+=5){ const v=ntLevel(date,"DA",(start+m)/60); if(v<bv){bv=v;best=m;} } return best; }

/* propranolol (β-bloqueio do efeito adrenérgico) — bula FDA: pico 1–4 h, t½ 3–6 h */
const PROPRA={ka:1.2, ke:0.17};
function propBatemanNorm(dtH){ if(dtH<=0) return 0; const ka=PROPRA.ka,ke=PROPRA.ke; const tmax=Math.log(ka/ke)/(ka-ke); const peak=(ka/(ka-ke))*(Math.exp(-ke*tmax)-Math.exp(-ka*tmax)); const v=(ka/(ka-ke))*(Math.exp(-ke*dtH)-Math.exp(-ka*dtH)); return v/peak; }
function propReduction(date,tH){ const mag=State.propraDose>=40?0.95:State.propraDose>=20?0.5:0.28; return mag*propBatemanNorm(tH-State.propraTime); }
function naReduced(date,tH){ return Math.max(NT.NA.base, ntLevel(date,"NA",tH)-propReduction(date,tH)); }

/* clonidina (α2-agonista) — reduz a LIBERAÇÃO central de noradrenalina (baixa a NA de fato, ao contrário do propranolol).
   Bula FDA: início ~30–60 min, pico do efeito anti-hipertensivo/simpaticolítico ~2–4 h, duração ~6–8 h; sedação dose-dependente. */
const CLON={ka:0.9, ke:0.18}; // efeito: Tmax ~2,2 h, duração ~7–8 h
const SOMN_THR=0.55;          // limiar de sonolência significativa
function clonBatemanNorm(dtH){ if(dtH<=0) return 0; const ka=CLON.ka,ke=CLON.ke; const tmax=Math.log(ka/ke)/(ka-ke); const peak=(ka/(ka-ke))*(Math.exp(-ke*tmax)-Math.exp(-ka*tmax)); const v=(ka/(ka-ke))*(Math.exp(-ke*dtH)-Math.exp(-ka*dtH)); return v/peak; }
function clonReduction(date,tH){ const mag=State.clonDose>=0.15?1.30:0.75; return mag*clonBatemanNorm(tH-State.clonTime); } // quanto de NA é retirado
function naReducedClon(date,tH){ return Math.max(NT.NA.base*0.7, ntLevel(date,"NA",tH)-clonReduction(date,tH)); } // pode descer abaixo da basal (supressão)
function clonSomnolence(date,tH){ const peak=State.clonDose>=0.15?1.00:0.50; return peak*clonBatemanNorm(tH-State.clonTime); } // índice de sonolência (escala própria 0–1)

/* ---- geometria do gráfico expandido ---- */
const BGEO={W:720,H:430,padL:10,padR:10,padT:46,padB:40};
function bX(h){ return BGEO.padL+(h/24)*(BGEO.W-BGEO.padL-BGEO.padR); }
function bY(v){ const y0=BGEO.H-BGEO.padB,y1=BGEO.padT; return y0-(Math.min(v,Y_MAX)/Y_MAX)*(y0-y1); }
function bYP(v){ const y0=BGEO.H-BGEO.padB,y1=BGEO.padT; return y0-(Math.min(v,Y_MAX_PROJ)/Y_MAX_PROJ)*(y0-y1); }
function y1Safe(){ return BGEO.padT+8; }
function annChip(x,y,label,color,active){ const w=label.length*6.6+16, bx=Math.min(Math.max(x-w/2,2),BGEO.W-w-2), h=19; return `<g><rect x="${bx.toFixed(1)}" y="${(y-h/2).toFixed(1)}" width="${w.toFixed(1)}" height="${h}" rx="9.5" fill="${active?color:cssVar('--card')}" stroke="${color}" stroke-width="1.6"/><text x="${(bx+w/2).toFixed(1)}" y="${(y+4).toFixed(1)}" font-size="11" font-weight="700" fill="${active?'#fff':color}" text-anchor="middle">${label}</text></g>`; }
function gridSVG(){ const g=BGEO,y0=g.H-g.padB,y1=g.padT; let s=""; for(let h=0;h<=24;h+=3){ s+=`<line x1="${bX(h)}" y1="${y1-4}" x2="${bX(h)}" y2="${y0}" stroke="${cssVar('--line')}" stroke-width="1"/><text x="${bX(h)}" y="${g.H-12}" font-size="12" fill="${cssVar('--muted')}" text-anchor="middle" font-family="ui-monospace,monospace">${String(h).padStart(2,'0')}h</text>`; } return s; }
function physSVG(emph){ let s=""; ["NA","DA","5HT"].forEach(k=>{ const yb=bY(NT[k].base); s+=`<line x1="${bX(0)}" y1="${yb}" x2="${bX(24)}" y2="${yb}" stroke="${ntColor(k)}" stroke-width="1.1" stroke-dasharray="2 4" opacity="${(!emph||emph===k)?.5:.22}"/>`; }); return s; }

function neuroBigBase(date, marker){
  const g=BGEO, y0=g.H-g.padB, y1=g.padT, N=240, dt=24/N, nts=activeNTs(date);
  let inR=false,rs=0; const riscos=[];
  for(let i=0;i<=N;i++){ const t=i*dt,v=ntProj(date,"NA",t); if(v>=NA_RISCO_PROJ&&!inR){inR=true;rs=t;} else if(v<NA_RISCO_PROJ&&inR){inR=false;riscos.push([rs,t]);} }
  if(inR) riscos.push([rs,24]);
  let defs="<defs>";
  nts.forEach(k=>{ const c=ntColor(k); defs+=`<linearGradient id="bg_${k}" x1="0" y1="${y1}" x2="0" y2="${y0}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${hexToRgba(c,.45)}"/><stop offset="0.55" stop-color="${hexToRgba(c,.16)}"/><stop offset="1" stop-color="${hexToRgba(c,.02)}"/></linearGradient>`; });
  defs+=`<pattern id="bhatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="${hexToRgba(cssVar('--warn'),.10)}"/><line x1="0" y1="0" x2="0" y2="7" stroke="${hexToRgba(cssVar('--warn'),.5)}" stroke-width="1.4"/></pattern></defs>`;
  const st=dayStartMin(date), on=onsetMin(date), cn=st+crashNoctOffset(date);
  let zones=`<rect x="${bX(0)}" y="${y1}" width="${bX(st/60)-bX(0)}" height="${y0-y1}" fill="${hexToRgba(cssVar('--slate'),.05)}"/>`;
  if(cn/60<24) zones+=`<rect x="${bX(cn/60)}" y="${y1}" width="${bX(24)-bX(cn/60)}" height="${y0-y1}" fill="${hexToRgba(cssVar('--gaba'),.06)}"/>`;
  let vale=""; if(on>st){ const xa=bX(st/60),xb=bX(on/60); vale=`<rect x="${xa}" y="${y1}" width="${xb-xa}" height="${y0-y1}" fill="${hexToRgba(ntColor('DA'),.09)}"/>`; }
  let riskRects=""; riscos.forEach(([a,b])=>{ riskRects+=`<rect x="${bX(a)}" y="${y1}" width="${bX(b)-bX(a)}" height="${y0-y1}" fill="url(#bhatch)" rx="3"/>`; });
  let curves=""; nts.forEach(k=>{ const c=ntColor(k); let line="",area=`M ${bX(0).toFixed(1)} ${y0.toFixed(1)} `; for(let i=0;i<=N;i++){ const t=i*dt,v=ntProj(date,k,t),px=bX(t).toFixed(1),py=bYP(v).toFixed(1); line+=(i===0?`M ${px} ${py} `:`L ${px} ${py} `); area+=`L ${px} ${py} `; } area+=`L ${bX(24).toFixed(1)} ${y0.toFixed(1)} Z`; curves+=`<path d="${area}" fill="url(#bg_${k})"/><path d="${line}" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`; });
  let marks=""; const seen=new Set(); dosesForDay(date).forEach(d=>{ if(seen.has(d.min)) return; seen.add(d.min); const px=bX(d.min/60); marks+=`<line x1="${px}" y1="${y1+18}" x2="${px}" y2="${y0}" stroke="${cssVar('--slate')}" stroke-width="1" stroke-dasharray="2 3" opacity=".32"/><circle cx="${px}" cy="${y1+24}" r="3" fill="${cssVar('--ink')}"/><text x="${px}" y="${y1+13}" font-size="10.5" font-weight="700" fill="${cssVar('--slate')}" text-anchor="middle" font-family="ui-monospace,monospace">${hhmm(d.min)}</text>`; });
  const oH=on/60, pH=peakMin(date)/60, midH=((st+on)/2)/60;
  let ann="";
  ann+=annChip(bX(midH), y0-20, "vale", ntColor('DA'), marker==='vale');
  ann+=`<line x1="${bX(oH)}" y1="${y1}" x2="${bX(oH)}" y2="${y0}" stroke="${cssVar('--accent')}" stroke-width="1.7" stroke-dasharray="5 3"/>`;
  ann+=annChip(bX(oH), y1+30, "início", cssVar('--accent'), marker==='onset');
  { const yv=bYP(ntProj(date,"DA",pH)); ann+=`<circle cx="${bX(pH).toFixed(1)}" cy="${yv.toFixed(1)}" r="${marker==='peak'?7.5:5.5}" fill="${cssVar('--warn')}" stroke="${cssVar('--card')}" stroke-width="2"/>`; ann+=annChip(bX(pH), yv-18, "pico", cssVar('--warn'), marker==='peak'); }
  let naThrX="", platShadeX="", platLblX="";
  if(nts.includes("NA")){ const yT=bYP(NA_RISCO_PROJ);
    naThrX=`<line x1="${bX(0).toFixed(1)}" y1="${yT.toFixed(1)}" x2="${bX(24).toFixed(1)}" y2="${yT.toFixed(1)}" stroke="${cssVar('--warn')}" stroke-width="1.4" stroke-dasharray="6 4" opacity=".75"/>`;
    const tagW=108, tagX=bX(0)+6, tagY=yT-19;
    naThrX+=`<g><rect x="${tagX.toFixed(1)}" y="${tagY.toFixed(1)}" width="${tagW}" height="16" rx="8" fill="${cssVar('--warn')}"/><text x="${(tagX+tagW/2).toFixed(1)}" y="${(tagY+11.5).toFixed(1)}" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">sobrecarga de NA</text></g>`;
  }
  if(nts.includes("DA") && State.meds.some(m=>m.bicModel)){
    const pb=plateauBandDA(date), yHi=bYP(pb.high), yLo=bYP(pb.low), c=ntColor("DA");
    platShadeX=`<rect x="${bX(0).toFixed(1)}" y="${yHi.toFixed(1)}" width="${(bX(24)-bX(0)).toFixed(1)}" height="${Math.max(2,yLo-yHi).toFixed(1)}" fill="${hexToRgba(c,.12)}"/>`
      +`<line x1="${bX(0).toFixed(1)}" y1="${yHi.toFixed(1)}" x2="${bX(24).toFixed(1)}" y2="${yHi.toFixed(1)}" stroke="${c}" stroke-width="1.1" stroke-dasharray="5 4" opacity=".6"/>`
      +`<line x1="${bX(0).toFixed(1)}" y1="${yLo.toFixed(1)}" x2="${bX(24).toFixed(1)}" y2="${yLo.toFixed(1)}" stroke="${c}" stroke-width="1.1" stroke-dasharray="5 4" opacity=".6"/>`;
    platLblX=`<text x="${(bX(24)-6).toFixed(1)}" y="${(yHi-5).toFixed(1)}" font-size="11" font-weight="700" fill="${c}" text-anchor="end">platô lisdex · 55–70 mg</text>`;
  }
  return `<svg class="nt" id="expbase" viewBox="0 0 ${g.W} ${g.H}" preserveAspectRatio="xMidYMid meet">${defs}${gridSVG()}${zones}${circBasePath(bX, bYP, N)}${vale}${platShadeX}${riskRects}${curves}${naThrX}${platLblX}${marks}${ann}</svg>`;
}
function neuroBigCursor(date, cursorH){ const g=BGEO,y0=g.H-g.padB,y1=g.padT,nts=activeNTs(date); let out=""; if(cursorH!=null){ const px=bX(cursorH); out+=`<line x1="${px}" y1="${y1-6}" x2="${px}" y2="${y0}" stroke="${cssVar('--ink')}" stroke-width="2"/>`; nts.forEach(k=>{ const v=ntProj(date,k,cursorH); out+=`<circle cx="${px}" cy="${bYP(v)}" r="5.5" fill="${ntColor(k)}" stroke="${cssVar('--card')}" stroke-width="2"/>`; }); const lbl=hhmm(cursorH*60); out+=`<g><rect x="${Math.min(Math.max(px-29,2),g.W-60)}" y="${y1-26}" width="58" height="20" rx="6" fill="${cssVar('--ink')}"/><text x="${Math.min(Math.max(px,31),g.W-31)}" y="${y1-11}" font-size="13" font-weight="700" fill="${cssVar('--bg')}" text-anchor="middle" font-family="ui-monospace,monospace">${lbl}</text></g>`; } return `<svg class="nt nt-overlay" id="expcursor" viewBox="0 0 ${g.W} ${g.H}" preserveAspectRatio="xMidYMid meet">${out}</svg>`; }
function markerTimeH(type,date){ const st=dayStartMin(date); if(type==="vale") return ((st+onsetMin(date))/2)/60; if(type==="onset") return onsetMin(date)/60; if(type==="peak") return peakMin(date)/60; return nowH(); }

/* contribuição por remédio (NA ou DA) — cores próprias só aqui */
function contribColor(id){ const m={v70:cssVar('--da'), v20:cssVar('--gaba'), bupro:cssVar('--ach'), venla:cssVar('--ht')}; return m[id]||medColor(find(id)); }
function shortMedName(m){ const n={v70:'Lisdex 70', v20:'Lisdex 20', bupro:'Bupropiona', venla:'Venlafaxina'}; return n[m.id]||m.nome.split(' ')[0]; }
function contribChart(date, ntKey){
  const g=BGEO,y0=g.H-g.padB,y1=g.padT,N=240,dt=24/N;
  let riskRects="";
  if(ntKey==="NA"){ let inR=false,rs=0; const r=[]; for(let i=0;i<=N;i++){ const t=i*dt,v=ntLevel(date,"NA",t); if(v>=NA_RISCO_LIMIAR&&!inR){inR=true;rs=t;} else if(v<NA_RISCO_LIMIAR&&inR){inR=false;r.push([rs,t]);} } if(inR) r.push([rs,24]); r.forEach(([a,b])=>{ riskRects+=`<rect x="${bX(a)}" y="${y1}" width="${bX(b)-bX(a)}" height="${y0-y1}" fill="${hexToRgba(cssVar('--warn'),.07)}"/>`; }); }
  const meds=medsForNT(date,ntKey); let medCurves="";
  meds.forEach(m=>{ let line=""; for(let i=0;i<=N;i++){ const t=i*dt,v=medNTLevel(date,m.id,ntKey,t),px=bX(t).toFixed(1),py=bY(v).toFixed(1); line+=(i===0?"M":"L")+px+" "+py+" "; } medCurves+=`<path d="${line}" fill="none" stroke="${contribColor(m.id)}" stroke-width="1.9" opacity=".92" stroke-linecap="round" stroke-linejoin="round"/>`; });
  let tl="",ta=`M ${bX(0).toFixed(1)} ${y0.toFixed(1)} `; for(let i=0;i<=N;i++){ const t=i*dt,v=ntLevel(date,ntKey,t),px=bX(t).toFixed(1),py=bY(v).toFixed(1); tl+=(i===0?"M":"L")+px+" "+py+" "; ta+="L "+px+" "+py+" "; } ta+=`L ${bX(24).toFixed(1)} ${y0.toFixed(1)} Z`;
  const total=`<path d="${ta}" fill="${hexToRgba(ntColor(ntKey),.09)}"/><path d="${tl}" fill="none" stroke="${ntColor(ntKey)}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  let ann=""; if(ntKey==="DA") ann=dopaMarkersSVG(date);
  return `<svg class="nt" viewBox="0 0 ${g.W} ${g.H}" preserveAspectRatio="xMidYMid meet">${gridSVG()}${riskRects}${physSVG(ntKey)}${medCurves}${total}${ann}</svg>`;
}
function daDot(date,minAbs,label,color){ const t=minAbs/60, x=bX(t), y=bY(ntLevel(date,"DA",t)); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${color}" stroke="${cssVar('--card')}" stroke-width="2"/>`+annChip(x, Math.max(y-16,y1Safe()), label, color, false); }
function dopaMarkersSVG(date){ const st=dayStartMin(date), on=onsetMin(date);
  let s=""; s+=daDot(date,(st+on)/2,"vale",cssVar('--slate'));
  s+=daDot(date,st+daPeakOffset(date),"pico",cssVar('--accent'));
  s+=daDot(date,st+crashVespOffset(date),"crash vesp.",cssVar('--warn'));
  s+=daDot(date,st+crashNoctOffset(date),"crash not.",cssVar('--gaba'));

}

/* propranolol: NA com vs sem, barra arrastável (12h–18h) */
function propraChart(date){

  const yr=bY(NA_RISCO_LIMIAR); const thr=`<line x1="${bX(0)}" y1="${yr}" x2="${bX(24)}" y2="${yr}" stroke="${cssVar('--warn')}" stroke-width="1.3" stroke-dasharray="5 3" opacity=".7"/><text x="${bX(24)-4}" y="${yr-5}" font-size="10.5" fill="${cssVar('--warn')}" text-anchor="end" font-weight="700">sobrecarga</text>`;
  const win=`<rect x="${bX(12)}" y="${y1}" width="${bX(18)-bX(12)}" height="${y0-y1}" fill="${hexToRgba(cssVar('--gaba'),.05)}"/><text x="${(bX(12)+bX(18))/2}" y="${y1+12}" font-size="10" fill="${cssVar('--muted')}" text-anchor="middle">janela 12h–18h</text>`;
  let oline="",rline="",rarea=`M ${bX(0).toFixed(1)} ${y0.toFixed(1)} `;
  for(let i=0;i<=N;i++){ const t=i*dt, o=ntLevel(date,"NA",t), rr=naReduced(date,t), px=bX(t).toFixed(1); oline+=(i===0?"M":"L")+px+" "+bY(o).toFixed(1)+" "; rline+=(i===0?"M":"L")+px+" "+bY(rr).toFixed(1)+" "; rarea+="L "+px+" "+bY(rr).toFixed(1)+" "; }
  rarea+=`L ${bX(24).toFixed(1)} ${y0.toFixed(1)} Z`;
  const orig=`<path d="${oline}" fill="none" stroke="${hexToRgba(ntColor('NA'),.4)}" stroke-width="2" stroke-dasharray="3 3"/>`;
  const red=`<path d="${rarea}" fill="${hexToRgba(ntColor('NA'),.10)}"/><path d="${rline}" fill="none" stroke="${ntColor('NA')}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  const pt=State.propraTime, px=bX(pt);

  return `<svg class="nt" id="prosvg" viewBox="0 0 ${g.W} ${g.H}" preserveAspectRatio="xMidYMid meet">${gridSVG()}${win}${physSVG('NA')}${thr}${orig}${red}${bar}</svg>`;
}

/* clonidina: NA realmente reduzida (α2) + linha de sonolência, barra arrastável (12h–18h) */
function clonidinaChart(date){
  const g=BGEO,y0=g.H-g.padB,y1=g.padT,N=240,dt=24/N;
  const yr=bY(NA_RISCO_LIMIAR); const thr=`<line x1="${bX(0)}" y1="${yr}" x2="${bX(24)}" y2="${yr}" stroke="${cssVar('--warn')}" stroke-width="1.3" stroke-dasharray="5 3" opacity=".7"/><text x="${bX(24)-4}" y="${yr-5}" font-size="10.5" fill="${cssVar('--warn')}" text-anchor="end" font-weight="700">sobrecarga</text>`;
  const win=`<rect x="${bX(12)}" y="${y1}" width="${bX(18)-bX(12)}" height="${y0-y1}" fill="${hexToRgba(cssVar('--accent'),.05)}"/><text x="${(bX(12)+bX(18))/2}" y="${y1+12}" font-size="10" fill="${cssVar('--muted')}" text-anchor="middle">janela 12h–18h</text>`;
  const ySomn=s=>bY(s*2.6); // sonolência: escala própria 0–1 mapeada a 0–2,6 no eixo
  let oline="",rline="",rarea=`M ${bX(0).toFixed(1)} ${y0.toFixed(1)} `,sline="";
  for(let i=0;i<=N;i++){ const t=i*dt, o=ntLevel(date,"NA",t), rr=naReducedClon(date,t), s=clonSomnolence(date,t), px=bX(t).toFixed(1);
    oline+=(i===0?"M":"L")+px+" "+bY(o).toFixed(1)+" "; rline+=(i===0?"M":"L")+px+" "+bY(rr).toFixed(1)+" "; rarea+="L "+px+" "+bY(rr).toFixed(1)+" "; sline+=(i===0?"M":"L")+px+" "+ySomn(s).toFixed(1)+" "; }
  rarea+=`L ${bX(24).toFixed(1)} ${y0.toFixed(1)} Z`;
  const orig=`<path d="${oline}" fill="none" stroke="${hexToRgba(ntColor('NA'),.4)}" stroke-width="2" stroke-dasharray="3 3"/>`;
  const red=`<path d="${rarea}" fill="${hexToRgba(ntColor('NA'),.10)}"/><path d="${rline}" fill="none" stroke="${ntColor('NA')}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  const yth=ySomn(SOMN_THR); const somnThr=`<line x1="${bX(0)}" y1="${yth.toFixed(1)}" x2="${bX(24)}" y2="${yth.toFixed(1)}" stroke="${cssVar('--gaba')}" stroke-width="1.1" stroke-dasharray="2 3" opacity=".55"/><text x="${bX(0)+4}" y="${(yth-4).toFixed(1)}" font-size="10" fill="${cssVar('--gaba')}" font-weight="700">limiar de sonolência</text>`;
  const somn=`<path d="${sline}" fill="none" stroke="${cssVar('--gaba')}" stroke-width="2.4" stroke-dasharray="1 4" stroke-linecap="round" opacity=".9"/>`;
  const pt=State.clonTime, px=bX(pt);
  const bar=`<line x1="${px.toFixed(1)}" y1="${y1-4}" x2="${px.toFixed(1)}" y2="${y0}" stroke="${cssVar('--accent')}" stroke-width="3"/><circle cx="${px.toFixed(1)}" cy="${y0.toFixed(1)}" r="6.5" fill="${cssVar('--accent')}" stroke="${cssVar('--card')}" stroke-width="2"/>`+annChip(px, y1+12, "clonidina "+hhmm(pt*60), cssVar('--accent'), true);
  return `<svg class="nt" id="clonsvg" viewBox="0 0 ${g.W} ${g.H}" preserveAspectRatio="xMidYMid meet">${gridSVG()}${win}${physSVG('NA')}${thr}${somnThr}${orig}${red}${somn}${bar}</svg>`;
}
function clonidinaCallout(date){ const dose=State.clonDose;
  const teff=Math.min(State.clonTime+2.2, 23); // pico do efeito da clonidina
  const naAt=ntLevel(date,"NA",teff), naRedAt=naReducedClon(date,teff), drop=Math.max(0,naAt-naRedAt);
  let sMax=0; for(let h=8;h<=23;h+=0.1){ const v=clonSomnolence(date,h); if(v>sMax) sMax=v; }
  const dl=dose>=0.15?"0,150":"0,075";
  const somnTxt = sMax>=SOMN_THR ? "passa do limiar — <b>sonolência significativa</b>" : "fica abaixo do limiar — sonolência leve";
  return `<div class="pdoses"><button class="pdose ${dose<0.15?'on':''}" data-cd="0.075">0,075 mg</button><button class="pdose ${dose>=0.15?'on':''}" data-cd="0.15">0,150 mg</button></div>`
   +coBox("Clonidina — retira o excesso de noradrenalina","var(--accent)",`Arraste a barra azul-petróleo para mover a dose entre <b>12h e 18h</b>. A clonidina é <b>agonista α2</b>: reduz a <b>liberação central de noradrenalina</b>, então <b>baixa a NA de fato</b> — diferente do propranolol, que só bloqueia os receptores β. A partir de <b>${hhmm(State.clonTime*60)}</b>, no pico do efeito (~<b>${hhmm(teff*60)}</b>), a <b>${dl} mg</b> derruba a NA em ~<b>${drop.toFixed(2)}</b> da escala (de ~${naAt.toFixed(2)} para ~${naRedAt.toFixed(2)}), começando em ~30–60 min e durando ~6–8 h. O custo é <b>sedação</b>: a linha violeta pontilhada é a sonolência (escala própria) e, nesta dose, ${somnTxt}. A linha vermelha cheia é a NA com clonidina; a tracejada fina, a NA sem; a tracejada colorida, o fisiológico.`)
   +fdaRef(["clo"]); }

/* ---- callouts ---- */
function coBox(title,color,html){ return `<div class="card callout" style="border-left:4px solid ${color}"><div class="co-t" style="color:${color}">${title}</div><div class="co-p">${html}</div></div>`; }
function coEditor(type, curMin, nLogs){ return `<div class="card ed"><div class="ed-l">Ajustar pelo que de fato acontece</div><div class="ed-row"><input type="time" id="xt-time" value="${hhmm(curMin)}"><button class="sact primary" id="xt-reg">Registrar</button></div><div class="ed-foot">${nLogs?`Mediana de ${nLogs} registro(s) + previsão · `:"Sem ajustes ainda · "}<button class="mini-link" id="xt-clear">limpar</button></div></div>`; }
function calloutHTML(date,marker,cursorH){
  const st=dayStartMin(date);
  if(marker==="vale"){ const on=onsetMin(date); return coBox("Vale dopaminérgico","var(--da)",`Entre <b>00h</b> e a dose, e logo após acordar, dopamina e NA ficam abaixo do nível de efeito. Período de possível <b>desânimo, baixa motivação e sentimentos negativos</b> — mais longo quando ele acorda e toma a medicação mais tarde. Os efeitos começam por volta de <b>${hhmm(on)}</b>, ~<b>${on-st} min</b> após a dose.`)+fdaRef(["lis"]); }
  if(marker==="onset"){ const raw=st+rawOnsetOffset(date), on=onsetMin(date), logs=(State.sympLog.onset||[]); return coBox("Início dos efeitos","var(--accent)",`Foco, energia e motivação começam a subir (dextroanfetamina). Previsão do algoritmo: <b>${hhmm(raw)}</b> (~${rawOnsetOffset(date)} min após a dose). Horário em uso agora: <b>${hhmm(on)}</b>.`)+coEditor("onset", on, logs.length)+fdaRef(["lis"]); }
  if(marker==="peak"){ const pk=peakMin(date), imp=improveOffset(date), logs=(State.sympLog.peak||[]); const melhora=imp==null?"sem janela de sobrecarga prevista neste horário":`tende a melhorar em ~<b>${imp} min</b> (≈ <b>${hhmm(pk+imp)}</b>)`; return coBox("Pico — sobrecarga noradrenérgica","var(--warn)",`Efeitos máximos. Possíveis <b>sudorese, calor e névoa mental</b> pela carga noradrenérgica somada (venlafaxina + bupropiona + lisdexanfetamina). ${melhora}. Resgate: <b>propranolol</b> (aba ao lado).`)+coEditor("peak", pk, logs.length)+fdaRef(["lis","bup","ven"]); }
  const nts=activeNTs(date); let maxRef={}; nts.forEach(k=>{ let mx=0.01; for(let t=0;t<24;t+=0.25) mx=Math.max(mx,ntLevel(date,k,t)); maxRef[k]=mx; });
  const ch=cursorH==null?(isToday(date)?nowH():12):cursorH;
  const rows=nts.map(k=>{ const v=ntLevel(date,k,ch),pct=Math.round(Math.min(v/maxRef[k],1)*100); return `<div class="lv"><div class="ln"><i style="background:${ntColor(k)}"></i>${NT[k].label}</div><div class="bar"><div class="barfill" style="width:${pct}%;background:${ntColor(k)}"></div></div><div class="pct">${pct}%</div></div>`; }).join("");
  return `<div class="card levels"><h3>Níveis <span class="lv-when">às ${hhmm(ch*60)}</span></h3>${rows}<div class="lv-foot">Arraste o gráfico para explorar. As linhas tracejadas (mesmas cores) são o nível fisiológico, sem medicação.</div></div>`;
}
function naCallout(date){ const st=dayStartMin(date); let best=0,bv=-1; for(let m=0;m<=600;m+=5){ const v=ntLevel(date,"NA",(st+m)/60); if(v>bv){bv=v;best=m;} } const pkT=st+best, over=bv>=NA_RISCO_LIMIAR;
  return coBox("Noradrenalina — por medicamento","var(--na)",`Cada linha colorida é quanto cada remédio soma de NA; a linha grossa é o total. Os agentes noradrenérgicos são <b>venlafaxina</b> (em 300 mg a ação NA é forte), <b>bupropiona</b> e <b>lisdexanfetamina</b>. Pico de NA por volta de <b>${hhmm(pkT)}</b>. ${over?"Quando o total passa da linha de sobrecarga há risco de calor, sudorese, tremor e névoa mental — é a janela em que entra o propranolol.":"Neste horário o total não passa da faixa de sobrecarga."} A tracejada de cada cor é o nível fisiológico (sem medicação).`)+fdaRef(["ven","bup","lis"]); }
function dopaCallout(date){ const st=dayStartMin(date), on=onsetMin(date), pk=st+daPeakOffset(date), cv=st+crashVespOffset(date), cn=st+crashNoctOffset(date), wknd=dayType(date)==='weekend';
  return coBox("Dopamina — por medicamento e ao longo do dia","var(--da)",
    `Cada linha é a contribuição de um remédio (lisdexanfetamina 70 mg, reforço de 20 mg e bupropiona); a linha grossa é o total. A tracejada é o fisiológico.<br><br>`+
    `<b>Vale matinal</b> (${hhmm(st)}–${hhmm(on)}): dopamina baixa antes da lisdexanfetamina agir.<br>`+
    `<b>Pico</b> (≈ ${hhmm(pk)}): foco e motivação no máximo.<br>`+
    `<b>Crash vespertino</b> (≈ ${hhmm(cv)}): queda da dopamina à tarde. ${wknd?"No fim de semana ele costuma não sentir, provavelmente por menor demanda cognitiva — mas a queda continua existindo.":"Nos dias úteis a dose de reforço (lisdexanfetamina 20 mg + bupropiona) é tomada justamente para cobrir esse vale e evitar o crash."}<br>`+
    `<b>Crash noturno</b> (≈ ${hhmm(cn)}): à noite a medicação se dissipa, a dopamina cai abaixo do fisiológico e o rendimento diminui.`)
   +coBox("Possíveis efeitos do crash de dopamina","var(--warn)",`Cansaço e sonolência, queda de motivação e do humor (a bula da lisdexanfetamina descreve <b>fadiga e depressão</b> após a estimulação), irritabilidade, névoa mental, lentidão, dificuldade de iniciar e manter tarefas, fissura por carboidratos e, às vezes, rebote de ansiedade.`)
   +fdaRef(["lis","bup"]); }
function propraCallout(date){ const dose=State.propraDose; let oMax=0; for(let h=12;h<=22;h+=0.1){ const v=ntLevel(date,"NA",h); if(v>oMax) oMax=v; } let rMax=0; for(let h=12;h<=22;h+=0.1){ const v=naReduced(date,h); if(v>rMax) rMax=v; }
  const op=Math.round(oMax/Y_MAX*100), rp=Math.round(rMax/Y_MAX*100);
  return `<div class="pdoses"><button class="pdose ${dose===10?'on':''}" data-pd="10">10 mg</button><button class="pdose ${dose===20?'on':''}" data-pd="20">20 mg</button><button class="pdose ${dose===40?'on':''}" data-pd="40">40 mg</button></div>`
   +coBox("Propranolol — alívio adrenérgico","var(--gaba)",`Arraste a barra roxa para mover a dose entre <b>12h e 18h</b>. Modelo: a partir de <b>${hhmm(State.propraTime*60)}</b>, o propranolol <b>${dose} mg</b> reduz a carga noradrenérgica de pico de ~${op}% para ~${rp}% da escala, começando em ~30–60 min. Importante: ele <b>não baixa a noradrenalina</b> em si — bloqueia os receptores β e alivia calor, sudorese, tremor e taquicardia. A linha cheia é a NA com propranolol; a tracejada fina, sem; a tracejada colorida é o fisiológico.`)
   +fdaRef(["pro"]); }

/* ---- legendas por aba ---- */
function expLegend(date, tab){
  if(tab==='na'||tab==='dopa'){ const nt=tab==='na'?'NA':'DA'; const meds=medsForNT(date,nt);
    return `<div class="exp-legend">`+meds.map(m=>`<span><i style="background:${contribColor(m.id)}"></i>${esc(shortMedName(m))}</span>`).join("")+`<span><i style="background:${ntColor(nt)};height:3px;width:14px;border-radius:2px"></i>total</span><span><i class="dashed"></i>fisiológico</span>`+(tab==='dopa'?`<span><i style="background:var(--warn)"></i>crash</span>`:'')+`</div>`; }
  if(tab==='propra'){ return `<div class="exp-legend"><span><i style="background:var(--na)"></i>NA com propranolol</span><span><i style="background:${hexToRgba(ntColor('NA'),.4)}"></i>sem</span><span><i style="background:var(--warn);height:0;border-top:2px dashed var(--warn);width:14px"></i>limiar</span><span><i class="dashed"></i>fisiológico</span><span><i style="background:var(--gaba)"></i>propranolol</span></div>`; }
  if(tab==='clonidina'){ return `<div class="exp-legend"><span><i style="background:var(--na)"></i>NA com clonidina</span><span><i style="background:${hexToRgba(ntColor('NA'),.4)}"></i>sem</span><span><i style="background:var(--gaba)"></i>sonolência</span><span><i style="background:var(--warn);height:0;border-top:2px dashed var(--warn);width:14px"></i>sobrecarga</span><span><i style="background:var(--accent)"></i>clonidina</span></div>`; }
  return `<div class="exp-legend">`+activeNTs(date).map(k=>`<span><i style="background:${ntColor(k)}"></i>${NT[k].label}</span>`).join("")+`<span><i class="dashed"></i>fisiológico</span><span><i style="background:${hexToRgba(ntColor('DA'),.5)}"></i>vale</span><span><i style="background:var(--warn)"></i>sobrecarga</span><span><i style="background:var(--crash)"></i>crash de DA</span></div>`;
}

/* ---- render expandido com abas ---- */
const ETABS=[["vale","Vale"],["onset","Início"],["peak","Pico"],["explorar","Explorar"],["propra","Propranolol"],["clonidina","Clonidina"],["na","NA"],["dopa","Dopamina"]];
function renderExpand(){
  const date=State.selDate, vi=variantIndex(date), tab=State.expTab;
  const subEl=document.getElementById("exp-sub"); if(subEl) subEl.textContent=(dayType(date)==='weekend'?'Fim de semana':'Dia útil')+' · '+(isToday(date)?'hoje':fmtShort(date));
  const tabbar=`<div class="etabs">`+ETABS.map(([k,l])=>`<button class="etab ${tab===k?'on':''}" data-tab="${k}">${l}</button>`).join("")+`</div>`;
  let chart, callout;
  const dayTab=['vale','onset','peak','explorar'].includes(tab);
  if(tab==='propra'){ chart=`<div class="expwrap" id="expwrap">${propraChart(date)}</div>`; callout=propraCallout(date); }
  else if(tab==='clonidina'){ chart=`<div class="expwrap" id="expwrap">${clonidinaChart(date)}</div>`; callout=clonidinaCallout(date); }
  else if(tab==='na'){ chart=`<div class="expwrap" id="expwrap">${contribChart(date,'NA')}</div>`; callout=naCallout(date); }
  else if(tab==='dopa'){ chart=`<div class="expwrap" id="expwrap">${contribChart(date,'DA')}</div>`; callout=dopaCallout(date); }
  else { const marker=(tab==='explorar')?null:tab; const cursorH=marker?markerTimeH(marker,date):(State.expCursor!=null?State.expCursor:(isToday(date)?nowH():null)); chart=`<div class="expwrap" id="expwrap">${neuroBigBase(date,marker)}${neuroBigCursor(date,cursorH)}</div>`; callout=calloutHTML(date,marker,cursorH); }
  document.getElementById("exp-body").innerHTML=`
    <div class="exp-start"><button class="vbtn" data-es="-1">‹</button><div class="es-c"><div class="es-l">Horário da dose matinal</div><div class="es-t mono">${VARIANTS[vi]}</div></div><button class="vbtn" data-es="1">›</button></div>
    ${tabbar}
    ${chart}
    ${expLegend(date,tab)}
    <div id="exp-callout">${callout}</div>`;
  bindExpand();
}
let _expDrag=false;
function _expPick(e){ const wrap=document.getElementById("expwrap"); if(!wrap) return; const r=wrap.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX); let frac=(cx-r.left)/r.width; frac=Math.max(0,Math.min(1,frac));
  if(State.expTab==='propra'){ let h=frac*24; h=Math.max(12,Math.min(18,h)); State.propraTime=Math.round(h*4)/4; refreshPropra(); return; }
  if(State.expTab==='clonidina'){ let h=frac*24; h=Math.max(12,Math.min(18,h)); State.clonTime=Math.round(h*4)/4; refreshClon(); return; }
  // abas do dia: varredura
  State.expCursor=frac*24; const ov=document.getElementById("expcursor"); if(ov) ov.outerHTML=neuroBigCursor(State.selDate,State.expCursor); const co=document.getElementById("exp-callout"); if(co) co.innerHTML=calloutHTML(State.selDate,null,State.expCursor);
  document.querySelectorAll("#exp-body .etab").forEach(b=>b.classList.toggle("on", b.dataset.tab==='explorar')); State.expTab='explorar';
}
function refreshPropra(){ const sv=document.getElementById("expwrap"); if(sv) sv.innerHTML=propraChart(State.selDate); const co=document.getElementById("exp-callout"); if(co) co.innerHTML=propraCallout(State.selDate); bindPropDose(); }
function bindPropDose(){ document.querySelectorAll("#exp-body [data-pd]").forEach(b=>b.onclick=()=>{ State.propraDose=parseInt(b.dataset.pd); refreshPropra(); }); }
function refreshClon(){ const sv=document.getElementById("expwrap"); if(sv) sv.innerHTML=clonidinaChart(State.selDate); const co=document.getElementById("exp-callout"); if(co) co.innerHTML=clonidinaCallout(State.selDate); bindClonDose(); }
function bindClonDose(){ document.querySelectorAll("#exp-body [data-cd]").forEach(b=>b.onclick=()=>{ State.clonDose=parseFloat(b.dataset.cd); refreshClon(); }); }
function bindExpand(){
  document.querySelectorAll("#exp-body .etab").forEach(b=>b.onclick=()=>{ State.expTab=b.dataset.tab; State.expCursor=null; renderExpand(); });
  document.querySelectorAll("#exp-body [data-es]").forEach(b=>b.onclick=()=>expStartStep(parseInt(b.dataset.es)));
  const reg=document.getElementById("xt-reg"); if(reg) reg.onclick=()=>{ const v=document.getElementById("xt-time").value; if(!v) return; const pp=v.split(":"); logSymptom(State.expTab,(+pp[0])*60+(+pp[1])); };
  const clr=document.getElementById("xt-clear"); if(clr) clr.onclick=()=>clearSymptom(State.expTab);
  bindPropDose(); bindClonDose();
  const wrap=document.getElementById("expwrap"); if(!wrap) return;
  const draggable = (State.expTab==='propra' || State.expTab==='clonidina' || ['vale','onset','peak','explorar'].includes(State.expTab));
  if(draggable){
    wrap.addEventListener("touchstart",e=>{ _expDrag=true; _expPick(e); },{passive:true});
    wrap.addEventListener("touchmove",e=>{ if(_expDrag) _expPick(e); },{passive:true});
    wrap.addEventListener("touchend",()=>_expDrag=false,{passive:true});
    wrap.addEventListener("mousedown",e=>{ _expDrag=true; _expPick(e); });
  }
}
function expStartStep(d){ let i=variantIndex(State.selDate)+d; i=Math.max(0,Math.min(VARIANTS.length-1,i)); State.variants[State.selDate]=i; State.cursorH=null; save(); renderExpand(); }
function logSymptom(type, clockMin){ if(type!=="onset"&&type!=="peak") return; let off=clockMin-dayStartMin(State.selDate); if(isNaN(off)) return; if(off<0) off+=1440; if(off>16*60) return; State.sympLog[type]=(State.sympLog[type]||[]).concat([Math.round(off)]).slice(-12); save(); renderExpand(); }
function clearSymptom(type){ if(type!=="onset"&&type!=="peak") return; State.sympLog[type]=[]; save(); renderExpand(); }
function openExpand(){ State.expTab="vale"; State.expCursor=null; const ex=document.getElementById("expand"); ex.classList.add("show"); document.body.classList.add("noscroll"); const tEl=document.querySelector(".exp-title"); if(tEl) tEl.textContent="Neuroquímica do dia"; const cb=document.getElementById("exp-close"); if(cb) cb.onclick=closeExpand; renderExpand(); }
function closeExpand(){ const ex=document.getElementById("expand"); ex.classList.remove("show"); document.body.classList.remove("noscroll"); if(State.tab==="crono") renderCrono(); }
window.addEventListener("mousemove",e=>{ if(_expDrag) _expPick(e); if(_preDrag) _prePick(e); });
window.addEventListener("mouseup",()=>{ _expDrag=false; _preDrag=false; });

/* ============================================================ ROTEADOR + BOOT ============================================================ */
function rerender(){
  renderTabs(); setHeader();
  const t=State.tab;
  if(t==="crono") renderCrono();
  else if(t==="preawake") renderPreawake();
  else if(t==="nopre") renderNoPre();
  else if(t==="bicarb") renderBicarb();
  else if(t==="estoque") renderEstoque();
  else if(t==="exames") renderExames();
  else if(t==="pront") renderPront();
  else if(t==="farma") renderFarma();
}
document.getElementById("tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(!b) return; if(State.tab===b.dataset.tab) return; State.tab=b.dataset.tab; State.cursorH=null; State.bicCursor=null; rerender(); try{ document.getElementById("view").scrollTo(0,0); window.scrollTo(0,0); }catch(_){} });
document.getElementById("gear").onclick=openSettings;
document.getElementById("scrim").onclick=closeSheet;

setInterval(()=>{ if(State.tab==="crono" && State.cursorH==null){ const ov=document.getElementById("ntcursor"); if(ov){ ov.outerHTML=neuroCursorSVG(State.selDate,null); const lv=document.getElementById("levels"); if(lv){ lv.innerHTML=levelsHTML(State.selDate); bindLevels(); } } } }, 30000);

try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(State.theme==="auto") rerender(); }); }catch(_){}

injectCSS();
applyTheme();
rerender();
</script>
</body>
</html>
