<!DOCTYPE html>
<html lang="pt-BR" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RitmoMed">
<meta name="theme-color" content="#0E1116">

<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22RitmoMed%22%2C%22short_name%22%3A%22RitmoMed%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230E1116%22%2C%22theme_color%22%3A%22%230E1116%22%2C%22start_url%22%3A%22.%22%7D">
<title>RitmoMed</title>
<style>
:root{
  --bg:#EAEEF3; --bg2:#E1E6EE; --card:#FFFFFF; --ink:#0E1116; --slate:#5C6573;
  --muted:#8A93A2; --line:#E2E6EC; --accent:#1F7A75; --accent-ink:#0F4F4B;
  --chip:#F2F5F9; --field:#F5F7FA;
  --na:#E5342B; --da:#1366E0; --ht:#E8A40B; --ach:#27A567; --gaba:#7A5BE0;
  --warn:#D9772A; --warn-bg:rgba(217,119,42,.13); --crash:#C0455F; --crash-bg:rgba(192,69,95,.13); --ok:#1F9D55; --ok-bg:rgba(31,157,85,.12);
  --shadow:0 1px 2px rgba(16,22,32,.05),0 10px 26px rgba(16,22,32,.07);
  --shadow-sm:0 1px 2px rgba(16,22,32,.06);
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0D12; --bg2:#0F141B; --card:#161B23; --ink:#F0F3F8; --slate:#A4AEBD;
    --muted:#6E7886; --line:#242B35; --accent:#3BD6CE; --accent-ink:#8FF0EA;
    --chip:#1B222B; --field:#1A2129;
    --na:#FF5A4D; --da:#4D9BFF; --ht:#FFC233; --ach:#3BD98A; --gaba:#9E86FF;
    --warn:#F0964A; --warn-bg:rgba(240,150,74,.16); --crash:#E07A98; --crash-bg:rgba(224,122,152,.17); --ok:#3BD98A; --ok-bg:rgba(59,217,138,.14);
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.55);
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  }
}
[data-theme="dark"]{
  --bg:#0A0D12; --bg2:#0F141B; --card:#161B23; --ink:#F0F3F8; --slate:#A4AEBD;
  --muted:#6E7886; --line:#242B35; --accent:#3BD6CE; --accent-ink:#8FF0EA;
  --chip:#1B222B; --field:#1A2129;
  --na:#FF5A4D; --da:#4D9BFF; --ht:#FFC233; --ach:#3BD98A; --gaba:#9E86FF;
  --warn:#F0964A; --warn-bg:rgba(240,150,74,.16); --crash:#E07A98; --crash-bg:rgba(224,122,152,.17); --ok:#3BD98A; --ok-bg:rgba(59,217,138,.14);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.55);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.4; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}

/* Header */
.hdr{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);
  padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;border-bottom:1px solid transparent}
.hdr.scrolled{border-bottom-color:var(--line)}
.hdr-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hdr h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1}
.hdr .sub{color:var(--slate);font-size:13px;margin-top:3px;font-weight:500}
.gear{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;color:var(--ink);flex:0 0 auto;box-shadow:var(--shadow-sm)}
.gear:active{transform:scale(.94)}

/* Main */
main{flex:1;padding:14px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.sec-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  margin:22px 4px 9px}
.sec-label:first-child{margin-top:6px}

/* Date strip */
.datestrip{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.datestrip::-webkit-scrollbar{display:none}
.daycell{flex:0 0 auto;width:48px;padding:9px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);
  text-align:center;cursor:pointer;position:relative;transition:transform .12s}
.daycell:active{transform:scale(.95)}
.daycell .dow{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.daycell .dnum{font-size:18px;font-weight:700;margin-top:1px}
.daycell.today{border-color:var(--accent)}
.daycell.today .dnum{color:var(--accent)}
.daycell.sel{background:var(--ink);border-color:var(--ink)}
.daycell.sel .dow,.daycell.sel .dnum{color:var(--bg)}
[data-theme="dark"] .daycell.sel .dow,[data-theme="dark"] .daycell.sel .dnum{color:#0A0D12}
.daycell .dot{width:5px;height:5px;border-radius:50%;margin:3px auto 0}
.daycell .dot.full{background:var(--ok)} .daycell .dot.part{background:var(--warn)}
.daycell.sel .dot.full{background:#fff} .daycell.sel .dot.part{background:#fff}

/* Variant selector */
.variant{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;margin-top:10px}
.variant .vlabel{font-size:12px;color:var(--slate);font-weight:600}
.variant .vtime{font-size:24px;font-weight:800;letter-spacing:-.03em}
.variant .vcenter{text-align:center;flex:1;-webkit-user-select:none;user-select:none}
.vbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--field);
  display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:20px;flex:0 0 auto}
.vbtn:active{transform:scale(.92)}
.vdots{display:flex;gap:6px;justify-content:center;margin-top:7px}
.vdots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:.2s}
.vdots i.on{background:var(--accent);width:18px;border-radius:3px}
.swipe-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:7px;font-weight:500}

/* Hero neuro card */
.hero{margin-top:10px;padding:15px 14px 10px;overflow:hidden}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 6px}
.hero-top h2{font-size:15px;font-weight:700;margin:0;letter-spacing:-.01em}
.legend{display:flex;gap:11px;flex-wrap:wrap;margin:8px 2px 2px}
.legend span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--slate);font-weight:600}
.legend i{width:11px;height:11px;border-radius:3px}
.nt-wrap{width:100%;position:relative}
svg.nt{width:100%;height:auto;display:block;touch-action:pan-y}

/* Live levels */
.levels{padding:14px 16px;margin-top:10px}
.levels h3{font-size:13px;font-weight:700;margin:0 0 11px;color:var(--ink)}
.lv{display:flex;align-items:center;gap:11px;margin:9px 0}
.lv .ln{width:104px;font-size:12.5px;font-weight:600;color:var(--slate);display:flex;align-items:center;gap:6px}
.lv .ln i{width:9px;height:9px;border-radius:50%}
.lv .bar{flex:1;height:9px;border-radius:6px;background:var(--field);overflow:hidden}
.lv .bar>div{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.lv .pct{width:38px;text-align:right;font-size:12px;font-weight:600;color:var(--muted)}

/* Schedule list */
.sched{padding:5px 0;margin-top:10px}
.dose{display:flex;align-items:center;gap:13px;padding:12px 16px;cursor:pointer;border-top:1px solid var(--line)}
.dose:first-child{border-top:none}
.dose:active{background:var(--field)}
.dose .chk{width:25px;height:25px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.dose.done .chk{background:var(--ok);border-color:var(--ok)}
.dose .chk svg{opacity:0;transition:.15s;transform:scale(.6)}
.dose.done .chk svg{opacity:1;transform:scale(1)}
.dose .dtime{font-size:15px;font-weight:700;width:54px;flex:0 0 auto}
.dose .dinfo{flex:1;min-width:0}
.dose .dname{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dose.done .dname{text-decoration:line-through;color:var(--muted)}
.dose .ddose{font-size:12.5px;color:var(--slate);margin-top:1px}
.dose .pill{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

/* Estoque */
.stock{padding:15px 16px;margin-bottom:12px}
.stock-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.stock-h .nm{font-size:16px;font-weight:700}
.stock-h .cls{font-size:12px;color:var(--slate);margin-top:1px}
.daysleft{text-align:right;flex:0 0 auto}
.daysleft .n{font-size:22px;font-weight:800;line-height:1}
.daysleft .u{font-size:11px;color:var(--muted);font-weight:600}
.daysleft.warn .n{color:var(--warn)}
.sbar{height:8px;border-radius:5px;background:var(--field);margin:13px 0 6px;overflow:hidden}
.sbar>div{height:100%;border-radius:5px;transition:width .5s}
.stock-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--slate)}
.alert{display:flex;align-items:center;gap:9px;background:var(--warn-bg);color:var(--warn);
  border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;font-weight:600}
.stock-actions{display:flex;gap:8px;margin-top:13px}
.sact{flex:1;padding:10px;border-radius:11px;border:1px solid var(--line);background:var(--field);
  font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
.sact:active{transform:scale(.97)}
.sact.primary{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] .sact.primary{color:#0A0D12}

/* Prontuário */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;
  text-transform:uppercase;margin:0 2px 6px}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--field);color:var(--ink);
  border-radius:13px;padding:13px 14px;font-size:15.5px;font-family:inherit;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:var(--card)}
.field textarea{min-height:78px;line-height:1.45}
.frow{display:flex;gap:10px}
.frow .field{flex:1}
.pront-meds{padding:14px 16px;margin-top:4px}
.pront-meds h3{font-size:13px;font-weight:700;margin:0 0 10px}
.pmed{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.pmed:first-of-type{border-top:none}
.pmed .pdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.pmed .pm-name{font-weight:600;flex:1}
.pmed .pm-dose{color:var(--slate);font-size:13px}

/* Farmacologia list */
.flist{overflow:hidden}
.frow-item{display:flex;align-items:center;gap:13px;padding:15px 16px;cursor:pointer;border-top:1px solid var(--line)}
.frow-item:first-child{border-top:none}
.frow-item:active{background:var(--field)}
.fic{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:var(--field);position:relative}
.fic svg{width:100%;height:100%}
.frow-item .ft{flex:1;min-width:0}
.frow-item .ft .fn{font-size:15.5px;font-weight:600}
.frow-item .ft .fc{font-size:12.5px;color:var(--slate);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);flex:0 0 auto}
.ntchips{display:flex;gap:5px;margin-top:5px}
.ntchip{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;color:#fff;letter-spacing:.02em}

/* Sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(8,11,16,.5);z-index:60;opacity:0;pointer-events:none;
  transition:opacity .25s;backdrop-filter:blur(2px)}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;
  background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:90vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:translateY(0)}
.sheet-grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 4px;flex:0 0 auto}
.sheet-body{overflow-y:auto;padding:8px 20px 24px;-webkit-overflow-scrolling:touch}
.sheet h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px}
.sheet .sheet-sub{color:var(--slate);font-size:13.5px;margin-bottom:14px}
.detail-block{margin:16px 0}
.detail-block .dh{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.detail-block p{margin:0;font-size:15px;line-height:1.5;color:var(--ink)}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.kv:first-of-type{border-top:none}
.kv .k{color:var(--slate)} .kv .v{font-weight:600;text-align:right}
.riskbox{background:var(--warn-bg);border-radius:13px;padding:13px 14px;display:flex;gap:11px;align-items:flex-start}
.riskbox .ri{color:var(--warn);flex:0 0 auto;margin-top:1px}
.riskbox .rt{font-size:14px;line-height:1.45}
.riskbox .rt b{color:var(--warn)}
.spark{width:100%;height:64px;margin:4px 0 0}

/* Settings sheet */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:none}
.set-row .sl{font-size:15px;font-weight:600}
.set-row .sd{font-size:12.5px;color:var(--slate);margin-top:2px;max-width:240px}
.seg{display:flex;background:var(--field);border-radius:11px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;color:var(--slate);font-size:13px;font-weight:600;
  padding:7px 13px;border-radius:9px;font-family:inherit}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}
.btn-line{width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--field);
  color:var(--na);font-size:14.5px;font-weight:600;margin-top:6px;font-family:inherit}
.btn-line:active{transform:scale(.98)}

.disclaimer{font-size:11.5px;color:var(--muted);line-height:1.5;text-align:center;padding:18px 24px 4px}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:520px;margin:0 auto;
  background:color-mix(in srgb,var(--bg) 84%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);display:flex;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px)}
nav.tabs button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;
  gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;font-family:inherit;padding:2px 0}
nav.tabs button svg{width:25px;height:25px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button:active{transform:scale(.9)}
.badge{position:absolute;top:-2px;right:50%;margin-right:-19px;min-width:16px;height:16px;border-radius:9px;
  background:var(--na);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="app">
  <header class="hdr" id="hdr">
    <div class="hdr-row">
      <div>
        <h1 id="hdr-title">Cronograma</h1>
        <div class="sub" id="hdr-sub"></div>
      </div>
      <button class="gear" id="gear" aria-label="Ajustes">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs"></nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="sheet-grab"></div><div class="sheet-body" id="sheet-body"></div></div>

<div class="expand" id="expand"><div class="exp-head"><div><div class="exp-title">Neuroquímica do dia</div><div class="exp-sub" id="exp-sub"></div></div><button class="exp-close" id="exp-close" aria-label="Fechar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="exp-scroll" id="exp-body"></div></div>

<script>
"use strict";
/* ============================================================
   RitmoMed — controle de medicação + neuroquímica + exames
   Dados do prontuário e exames (Gabriel C. Vargas, masc., 30a).
   As curvas de neurotransmissores e a estimativa de testosterona
   são modelos ILUSTRATIVOS (não medem níveis reais).
   ============================================================ */

/* ---------- storage com fallback ---------- */
const Store = (() => {
  let ok = false, mem = {};
  try { const k="__rm_test__"; localStorage.setItem(k,"1"); localStorage.removeItem(k); ok = true; } catch(e){ ok = false; }
  return {
    get(key, def){ try{ if(ok){ const v = localStorage.getItem(key); return v==null?def:JSON.parse(v); } }catch(e){} return (key in mem)?mem[key]:def; },
    set(key, val){ try{ if(ok){ localStorage.setItem(key, JSON.stringify(val)); return true; } }catch(e){ return false; } mem[key]=val; return true; },
    available: ok
  };
})();

/* ============================================================
   MEDICAÇÕES
   off=min a partir do início do dia · days: all|week|weekend
   mult=multiplicador do efeito · everyN usa anchorDate+intervalDays
   ka/ke (por hora) calibrados pelos Tmáx do prontuário
   ============================================================ */
const SEED_MEDS = [

/* ---------- testosterona: ciclo do cipionato (Deposteron) em estado estacionário ----------
   Meia-vida ~8 dias (FDA Depo-Testosterone); pico sérico em ~24-48 h. Sob reposição o eixo HPG
   fica suprimido, então o piso endógeno é baixo e, entre as aplicações, o nível decai rumo a esse
   piso. Modelo: soma das aplicações anteriores (acúmulo), contínuo de um ciclo para o outro,
   calibrado para o pico medido do paciente (0,75 ml -> 989 ng/dL). */
const T_KA=2.2, T_KE=Math.log(2)/8, T_BASE=140, T_INTERVAL=5, T_REF_DOSE=0.75, T_REF_VAL=989;
function tBatemanRaw(d){ if(d<=0) return 0; return (T_KA/(T_KA-T_KE))*(Math.exp(-T_KE*d)-Math.exp(-T_KA*d)); }
function tCycleSum(d){ let s=0; for(let k=0;k<16;k++) s+=tBatemanRaw(d+T_INTERVAL*k); return s; }
const T_CYC_PEAK=(function(){ let mx=0; for(let d=0;d<=T_INTERVAL;d+=0.02){ const v=tCycleSum(d); if(v>mx)mx=v; } return mx||1; })();
const T_TMAX=(function(){ let mx=0,md=0; for(let d=0;d<=T_INTERVAL;d+=0.02){ const v=tCycleSum(d); if(v>mx){mx=v;md=d;} } return md; })();
function testoEstimate(d, mlDose){ const dd=((d%T_INTERVAL)+T_INTERVAL)%T_INTERVAL; const peakAdd=(T_REF_VAL-T_BASE)*(mlDose/T_REF_DOSE); return T_BASE + peakAdd*(tCycleSum(dd)/T_CYC_PEAK); }
/* mesma injeção, intervalo qualquer: amplitude por dose calibrada do esquema de 5 dias (pico 989).
   Espaçar reduz o acúmulo, então pico e média caem e o vale aprofunda. */
const T_SCALE=(T_REF_VAL-T_BASE)/T_CYC_PEAK;
function testoStstAt(I, t, mlDose){ let s=0; const kf=Math.ceil(15/I)+1; for(let j=-30;j<=kf;j++) s+=tBatemanRaw(t-j*I); return T_BASE + T_SCALE*((mlDose||T_REF_DOSE)/T_REF_DOSE)*s; }

/* ---------- datas ---------- */
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseYmd(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
const DOW=["dom","seg","ter","qua","qui","sex","sáb"];
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function isToday(s){ return s===ymd(new Date()); }
function hhmm(min){ min=((min%1440)+1440)%1440; const h=Math.floor(min/60), m=Math.round(min%60); return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"); }
function timeToMin(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
function dayType(date){ const d=parseYmd(date).getDay(); return (d===0||d===6)?"weekend":"week"; }
function dayDiff(a,b){ return Math.round((parseYmd(a)-parseYmd(b))/86400000); }
function addDays(date,n){ const d=parseYmd(date); d.setDate(d.getDate()+n); return ymd(d); }
function fmtShort(date){ const d=parseYmd(date); return d.getDate()+" "+MES[d.getMonth()]; }

function variantIndex(date){ return State.variants[date] ?? 2; } // padrão 07:00 (índice 2 após incluir 06:00/06:30)
function dayStartMin(date){ return timeToMin(VARIANTS[variantIndex(date)]); }
function doseActive(dose, dt){ return dose.days==="all" || dose.days===dt; }
function dosesForDay(date){
  const start=dayStartMin(date), dt=dayType(date), list=[];
  State.meds.forEach(med=>{ if(med.cadence!=="daily" || !Array.isArray(med.doses)) return;
    med.doses.forEach((d,i)=>{ if(!doseActive(d,dt)) return; const m0=(d.abs!=null)?d.abs:start+d.off;
      list.push({ med, doseIndex:i, min:m0, units:d.units, mult:d.mult||1, lbl:d.lbl, key:med.id+"#"+i }); });
  });
  list.sort((a,b)=>a.min-b.min); return list;
}

/* ---------- ciclos (everyN com anchorDate) ---------- */
function isDueOn(med, date){ if(med.cadence!=="everyN"||!med.anchorDate) return false; const diff=dayDiff(date, med.anchorDate); return diff>=0 && diff % med.intervalDays===0; }
function nextDue(med, fromDate){ if(!med.anchorDate) return null; const diff=dayDiff(fromDate, med.anchorDate); if(diff<0) return med.anchorDate; const rem=diff % med.intervalDays; return rem===0 ? fromDate : addDays(fromDate, med.intervalDays-rem); }
function lastDue(med, fromDate){ if(!med.anchorDate) return null; const diff=dayDiff(fromDate, med.anchorDate); if(diff<0) return null; return addDays(fromDate, -(diff % med.intervalDays)); }
function hormDueOn(date){ return State.meds.filter(m=>m.cat==="horm" && isDueOn(m,date)); }

/* ---------- farmacocinética (Bateman normalizado) ---------- */
function bateman(tH, t0H, mag, ka, ke){ if(tH<=t0H) return 0; const dt=tH-t0H; const tmax=Math.log(ka/ke)/(ka-ke);
  const peak=(ka/(ka-ke))*(Math.exp(-ke*tmax)-Math.exp(-ka*tmax)); const v=(ka/(ka-ke))*(Math.exp(-ke*dt)-Math.exp(-ka*dt)); return mag*(v/peak); }
function ntLevel(date, ntKey, tH){ let sum=0; const startH=dayStartMin(date)/60; dosesForDay(date).forEach(d=>{
  if(d.med.bicModel){ if(d.doseIndex===0) sum += bicEffContrib(d.med, ntKey, tH, startH); return; }
  if(!d.med.efeitos) return; const t0=d.min/60;
  d.med.efeitos.forEach(e=>{ if(e.nt===ntKey) sum += d.mult*bateman(tH,t0,e.mag,e.ka,e.ke); }); }); return sum; }
function activeNTs(date){ const set=new Set(); dosesForDay(date).forEach(d=>{ if(d.med.efeitos) d.med.efeitos.forEach(e=>set.add(e.nt)); }); return ["NA","DA","5HT"].filter(k=>set.has(k)); }

/* ---------- projeção do gráfico: estado estacionário (carryover) + base circadiana periódica ----------
   A madrugada (00h até a dose) é a continuação dos remédios do dia anterior; o ciclo fecha em 24h.
   A base fisiológica é uma onda circadiana periódica (vale de madrugada, pico no meio do dia).
   Usado APENAS nos gráficos de projeção; a lógica de início/pico/crash segue o modelo de dose única. */
const PROJ_KDAYS=14, Y_MAX_PROJ=4.0, NA_RISCO_PROJ=3.2;
const NTCIRC={
  NA:  {day:0.95, night:0.38, trough:4.0, peak:10.5},
  DA:  {day:0.78, night:0.32, trough:4.0, peak:10.0},
  "5HT":{day:1.05, night:0.40, trough:4.5, peak:12.5}
};
function circShape(c,t){ let rise=c.peak-c.trough; if(rise<=0) rise+=24; const phi=(((t-c.trough)%24)+24)%24; return phi<rise ? 0.5*(1-Math.cos(Math.PI*phi/rise)) : 0.5*(1+Math.cos(Math.PI*(phi-rise)/(24-rise))); }
function circBase(ntKey,t){ const c=NTCIRC[ntKey]; return c.night+(c.day-c.night)*circShape(c,t); }
function ntMedSS(date, ntKey, tH){ let sum=0; const startH=dayStartMin(date)/60; dosesForDay(date).forEach(d=>{
  if(d.med.bicModel){ if(d.doseIndex===0) sum += bicEffContrib(d.med, ntKey, tH, startH); return; }
  if(!d.med.efeitos) return; const t0=d.min/60;
  d.med.efeitos.forEach(e=>{ if(e.nt!==ntKey) return; for(let k=0;k<PROJ_KDAYS;k++){ sum+=d.mult*bateman(tH+24*k,t0,e.mag,e.ka,e.ke); } }); }); return sum; }
function ntProj(date, ntKey, tH){ return circBase(ntKey,tH)+ntMedSS(date,ntKey,tH); }
function circBasePath(Xfn, Yfn, N){ let out=""; ["NA","DA","5HT"].forEach(k=>{ let line=""; for(let i=0;i<=N;i++){ const t=(i/N)*24, px=Xfn(t).toFixed(1), py=Yfn(circBase(k,t)).toFixed(1); line+=(i===0?"M ":"L ")+px+" "+py+" "; } out+=`<path d="${line}" fill="none" stroke="${ntColor(k)}" stroke-width="1.5" stroke-dasharray="3 4" opacity=".5"/>`; }); return out; }

/* ---------- cores ---------- */
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function isDark(){ const t=document.documentElement.getAttribute("data-theme"); if(t==="dark") return true; if(t==="light") return false; return window.matchMedia("(prefers-color-scheme: dark)").matches; }
function ntColor(k){ return cssVar(NT[k].varc); }
function medColor(med){ return med.cor || (med.efeitos? ntColor(med.efeitos[0].nt) : "var(--slate)"); }
function hexToRgba(hex,a){ hex=(hex||"").replace("#",""); if(hex.length===3) hex=hex.split("").map(c=>c+c).join(""); const n=parseInt(hex,16); if(isNaN(n)) return `rgba(127,127,127,${a})`; return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }

/* ---------- estoque / consumo ---------- */
function daysCount(flag){ return flag==="all"?7:flag==="week"?5:2; }
function weeklyUnits(med){ if(med.cadence!=="daily") return 0; let s=0; med.doses.forEach(d=>s+=d.units*daysCount(d.days)); return s; }
function consumoTxt(med){ const everyday=med.doses.every(d=>d.days==="all"); if(everyday){ const pd=weeklyUnits(med)/7; return (Number.isInteger(pd)?pd:pd.toFixed(1).replace(".",","))+"/dia"; } return weeklyUnits(med)+"/semana"; }
function diasRestantes(med){
  if(med.cat==="prn") return Infinity;
  if(med.cadence==="everyN"){ if(med.trackMl){ const doses=Math.floor(med.estoqueMl/med.mlPorDose); return doses*med.intervalDays; } return med.intervalDays>0? med.estoque*med.intervalDays : Infinity; }
  const c=weeklyUnits(med)/7; return c>0?Math.floor(med.estoque/c):Infinity;
}
function isAlert(med){ if(med.cat==="prn") return false; return diasRestantes(med)<=7; }
function alertCount(){ return State.meds.filter(isAlert).length; }
function nextDoseTxt(med){
  if(med.anchorDate){ const nd=nextDue(med, ymd(new Date())); if(!nd) return "—"; const diff=dayDiff(nd, ymd(new Date())); const ds=fmtShort(nd);
    if(diff<0) return "atrasada · "+ds; if(diff===0) return "hoje · "+ds; if(diff===1) return "amanhã · "+ds; return ds+" · em "+diff+" d"; }
  return "—";
}

/* ============================================================
   GRÁFICO DA NEUROQUÍMICA — base (estática) + cursor (interativo)
   ============================================================ */
const NTGEO={W:720,H:300,padL:8,padR:8,padT:34,padB:26};

  if(inR) riscos.push([rs,24]);

  nts.forEach(k=>{ const c=ntColor(k); defs+=`<linearGradient id="g_${k}" x1="0" y1="${y1}" x2="0" y2="${y0}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${hexToRgba(c,.5)}"/><stop offset="0.55" stop-color="${hexToRgba(c,.18)}"/><stop offset="1" stop-color="${hexToRgba(c,.02)}"/></linearGradient>`; });

  let grid="";

  const phys=circBasePath(ntX, ntY, N);

  let curves="";

    area+=`L ${ntX(24).toFixed(1)} ${y0.toFixed(1)} Z`; curves+=`<path d="${area}" fill="url(#g_${k})"/><path d="${line}" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`; });

    marks+=`<line x1="${px}" y1="${y1+14}" x2="${px}" y2="${y0}" stroke="${cssVar('--slate')}" stroke-width="1" stroke-dasharray="2 3" opacity=".4"/><circle cx="${px}" cy="${y1+20}" r="3.2" fill="${cssVar('--ink')}"/><text x="${px}" y="${y1+11}" font-size="11" font-weight="700" fill="${cssVar('--slate')}" text-anchor="middle" font-family="ui-monospace,monospace">${hhmm(d.min)}</text>`; });

  let valeShade="", onsetLine=""; { const stM=dayStartMin(date), onM=onsetMin(date); if(onM>stM){ const xa=ntX(stM/60), xb=ntX(onM/60); valeShade=`<rect x="${xa}" y="${y1+18}" width="${xb-xa}" height="${y0-y1-18}" fill="${hexToRgba(ntColor('DA'),.08)}"/>`; onsetLine=`<line x1="${ntX(onM/60)}" y1="${y1+16}" x2="${ntX(onM/60)}" y2="${y0}" stroke="${cssVar('--accent')}" stroke-width="1.4" stroke-dasharray="4 3" opacity=".8"/>`; } }
  let crashShade="", crashLbl=""; activeNTs(date).includes("DA") && crashZonesProj(date).forEach(z=>{ const xa=ntX(z.x0),xb=ntX(z.x1),op=Math.min(0.05+(z.depth-0.5)*0.11,0.20).toFixed(2);
    crashShade+=`<rect x="${xa.toFixed(1)}" y="${(y1-2).toFixed(1)}" width="${(xb-xa).toFixed(1)}" height="${(y0-y1+2).toFixed(1)}" fill="${cssVar('--crash')}" opacity="${op}" rx="3"/><line x1="${xa.toFixed(1)}" y1="${(y1-2).toFixed(1)}" x2="${xa.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="${cssVar('--crash')}" stroke-width="1.3" stroke-dasharray="3 2" opacity=".75"/>`;
    const lx=Math.min(Math.max((xa+xb)/2,46),g.W-46), ly=y1+(y0-y1)*0.62;
    crashLbl+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="11" font-weight="800" fill="${cssVar('--crash')}" text-anchor="middle">crash</text>`; });

  }

    platShade=`<rect x="${x0.toFixed(1)}" y="${yHi.toFixed(1)}" width="${(x1-x0).toFixed(1)}" height="${Math.max(2,yLo-yHi).toFixed(1)}" fill="${hexToRgba(c,.12)}"/>`
      +`<line x1="${x0.toFixed(1)}" y1="${yHi.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${yHi.toFixed(1)}" stroke="${c}" stroke-width="1.1" stroke-dasharray="5 4" opacity=".6"/>`
      +`<line x1="${x0.toFixed(1)}" y1="${yLo.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${yLo.toFixed(1)}" stroke="${c}" stroke-width="1.1" stroke-dasharray="5 4" opacity=".6"/>`;
    platLbl=`<text x="${(x1-6).toFixed(1)}" y="${(yHi-4).toFixed(1)}" font-size="10" font-weight="700" fill="${c}" text-anchor="end">platô lisdex · 55–70 mg</text>`;

  return `<svg class="nt" id="ntbase" viewBox="0 0 ${g.W} ${g.H}" preserveAspectRatio="none" aria-label="Neuroquímica do dia">${defs}${grid}${phys}${valeShade}${platShade}${crashShade}${riskRects}${curves}${naThr}${platLbl}${marks}${onsetLine}${crashLbl}</svg>`;
}
function neuroCursorSVG(date, cursorH){

  const now=new Date(); const liveH=isToday(date)?(now.getHours()+now.getMinutes()/60):null;
  let out="";
  if(liveH!=null){ const px=ntX(liveH); out+=`<line x1="${px}" y1="${y1-2}" x2="${px}" y2="${y0}" stroke="${cssVar('--accent')}" stroke-width="1.5" opacity=".5"/>`; }
  if(cursorH!=null){ const px=ntX(cursorH);
    out+=`<line x1="${px}" y1="${y1-6}" x2="${px}" y2="${y0}" stroke="${cssVar('--ink')}" stroke-width="2"/>`;
    nts.forEach(k=>{ const v=ntProj(date,k,cursorH); out+=`<circle cx="${px}" cy="${ntY(v)}" r="5" fill="${ntColor(k)}" stroke="${cssVar('--card')}" stroke-width="2"/>`; });
    out+=`<g><rect x="${Math.min(Math.max(px-26,2),g.W-54)}" y="${y1-22}" width="52" height="18" rx="5" fill="${cssVar('--ink')}"/><text x="${Math.min(Math.max(px,28),g.W-28)}" y="${y1-9}" font-size="12" font-weight="700" fill="${cssVar('--bg')}" text-anchor="middle" font-family="ui-monospace,monospace">${hhmm(cursorH*60)}</text></g>`; }

function medSpark(med){
  if(!med.efeitos) return ""; const W=320,H=64,pad=4,x0=pad,x1=W-pad,y0=H-pad,y1=pad,t0=2; let maxV=0.01; const pts=[];
  for(let i=0;i<=120;i++){ const t=t0+(i/120)*12; let s=0; med.efeitos.forEach(e=>s+=bateman(t,t0,e.mag,e.ka,e.ke)); pts.push([i/120,s]); maxV=Math.max(maxV,s); }
  const X=u=>x0+u*(x1-x0), Y=v=>y0-(v/maxV)*(y0-y1)*0.92, c=ntColor(med.efeitos[0].nt); let line="",area=`M ${X(0)} ${y0} `;
  pts.forEach(([u,v],i)=>{ const px=X(u).toFixed(1),py=Y(v).toFixed(1); line+=(i===0?`M ${px} ${py} `:`L ${px} ${py} `); area+=`L ${px} ${py} `; }); area+=`L ${X(1)} ${y0} Z`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}"><path d="${area}" fill="${hexToRgba(c,.16)}"/><path d="${line}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/></svg>`;

/* ============================================================ PRÉ-DESPERTAR (Pre-Awakening Dosing) ============================================================
   Dose de estimulante ANTES de acordar para vencer a inércia matinal. Projeção de um dia (base circadiana + medicação),
   mesma bateman/circBase do app. Métricas pesquisadas (bula FDA + estudos):
   - Lisdexanfetamina (Vyvanse): pró-fármaco; início ~90 min; Tmax da dexanfetamina ~3,8 h (jejum); duração até ~14 h.
   - Metilfenidato IR (Ritalin): início ~30 min; Tmax 1–2 h; t½ ~2,7 h; duração 3–4 h. Modelo ka 1,4 / ke 0,257 (estimado). */
const LIS_TMAX_H = Math.log(0.42/0.15)/(0.42-0.15);            // ~3,81 h (pico da dexanfetamina, bula FDA jejum)
const MPHK = {ka:1.4, ke:0.257, da10:0.35, na10:0.30};       // metilfenidato IR 10 mg (estimado)
const MPH_TMAX_H = Math.log(MPHK.ka/MPHK.ke)/(MPHK.ka-MPHK.ke); // ~1,48 h
function preCfg(){ const idx=State.preStartIdx??0; const medsH=timeToMin(VARIANTS[idx])/60; const lead=State.preLead??1.5; const wakeH=medsH-0.5;
  return { medsH, preH:wakeH-lead, wakeH, workH:wakeH+2.5, reforcoH:medsH+5.5, idx, lead }; }
function lisDoses(mg,t0){ const s=mg/70; return [{nt:"DA",t0,mag:1.00*s,ka:.42,ke:.15},{nt:"NA",t0,mag:.90*s,ka:.42,ke:.15}]; }
function mphDoses(mg,t0){ const s=mg/10; return [{nt:"DA",t0,mag:MPHK.da10*s,ka:MPHK.ka,ke:MPHK.ke},{nt:"NA",t0,mag:MPHK.na10*s,ka:MPHK.ka,ke:MPHK.ke}]; }
function baseDoses(h){ return [ {nt:"NA",t0:h,mag:.60,ka:.35,ke:.06}, {nt:"DA",t0:h,mag:.40,ka:.4,ke:.075}, {nt:"NA",t0:h,mag:.42,ka:.4,ke:.075} ]; } // venlafaxina + bupropiona(NA reduzida, NET fraco)
// esquema NORMAL (referência): tudo ao acordar/horário normal, SEM pré-despertar — Venvanse 70 mg no início + 20 mg de reforço
function normalDoses(){ const c=preCfg(); return [ ...baseDoses(c.medsH), ...lisDoses(70,c.medsH), ...lisDoses(20,c.reforcoH) ]; }
function preLevel(doses,k,t){ let s=circBase(k,t); for(const d of doses) if(d.nt===k) s+=bateman(t,d.t0,d.mag,d.ka,d.ke); return s; }
function prePeak(doses,k,a,b){ let mx=0,mt=a; for(let t=a;t<=b;t+=0.02){ const v=preLevel(doses,k,t); if(v>mx){mx=v;mt=t;} } return [mx,mt]; }
// cenário lisdex: 1ª dose no pré-despertar; reforços no Tmax da anterior ("quando a DA começa a decair")
function buildLis(seq){ const c=preCfg(); const doses=[...baseDoses(c.medsH)]; const marks=[]; let t=c.preH;
  for(let i=0;i<seq.length;i++){ if(i>0) t=marks[i-1].h+LIS_TMAX_H; marks.push({h:t,lbl:seq[i]+" mg"}); doses.push(...lisDoses(seq[i],t)); }
  return {doses,marks,cfg:c}; }
// cenário metilfenidato IR: MPH no pré-despertar (início rápido); Venvanse 70 ao acordar; reforço 20 à tarde
// cenário metilfenidato IR (dose para acordar) + sequência de lisdexanfetamina:
// MPH no pré-despertar; lisdex começa ao acordar; reforços no Tmax da dose anterior
function buildMphLis(mphMg,seq){ const c=preCfg(); const doses=[...baseDoses(c.medsH), ...mphDoses(mphMg,c.preH)];
  const marks=[{h:c.preH,lbl:"MPH "+mphMg+" mg",mph:true}]; let t=c.wakeH, prev=null;
  for(let i=0;i<seq.length;i++){ if(i>0) t=prev+LIS_TMAX_H; marks.push({h:t,lbl:"V "+seq[i]+" mg"}); doses.push(...lisDoses(seq[i],t)); prev=t; }
  return {doses,marks,cfg:c}; }
const PRE_LIS=[
 {id:"E",nome:"70 mg (dose única, sem reforço)",seq:[70],tot:70},
 {id:"A",nome:"70 mg + reforço 20 mg",seq:[70,20],tot:90},
 {id:"B",nome:"50 mg + 20 mg + 20 mg",seq:[50,20,20],tot:90},
 {id:"C",nome:"20 mg + 50 mg + 20 mg",seq:[20,50,20],tot:90},
 {id:"D",nome:"50 mg + reforço 50 mg",seq:[50,50],tot:100},
];
const MPH_SEQ=[
 {id:"M1",seq:[70,20,20],tot:110},
 {id:"M2",seq:[50,20,20],tot:90},
 {id:"M3",seq:[20,50,20],tot:90},
 {id:"M4",seq:[20,70],tot:90},
 {id:"M5",seq:[50,20],tot:70},

 {id:"M8",seq:[40,20],tot:60},

/* ============================================================ BICARBONATO + LISDEX ============================================================ */
/* Modelo farmacocinético do par lisdexanfetamina -> dexanfetamina + bicarbonato de sódio (pH urinário).
   FONTES (defensáveis): Huang, Czuba & Isoherranen 2020 (JPET 373:488) p/ CLr(pH) e PK da anfetamina;
   bula FDA Vyvanse p/ conversão do pró-fármaco; Cohen 2013, Robey & Nesbit 2013, Sönmez 2018 p/ o surto de pH do bicarbonato.
   Modelo de CONCENTRAÇÃO PLASMÁTICA (não o de efeito das outras abas). */
const BIC = {
  CLH:7.41, V:250, KA:1.5, KC:0.77,
  FCONV:135.21/455.59,
  CLR_LO:0.7, CLR_HI:24.0, CLR_K:1.1219, CLR_P50:6.2328,
  PH_BASE:5.5, PH_CAP:8.3, KAB:1.2, KEL:0.30, DPH_MAX:3.2, ED50:2.5
};
BIC.SMAX = (function(){ const tp=Math.log(BIC.KAB/BIC.KEL)/(BIC.KAB-BIC.KEL); return Math.exp(-BIC.KEL*tp)-Math.exp(-BIC.KAB*tp); })();
function bicCLr(pH){ return BIC.CLR_LO + (BIC.CLR_HI-BIC.CLR_LO)/(1+Math.pow(10, BIC.CLR_K*(pH-BIC.CLR_P50))); }
function bicKe(pH){ return (BIC.CLH+bicCLr(pH))/BIC.V; }
function bicThalf(pH){ return Math.log(2)/bicKe(pH); }
function bicFexcr(pH){ const r=bicCLr(pH); return r/(r+BIC.CLH); }
function bicSurge(tau){ return tau<=0?0:(Math.exp(-BIC.KEL*tau)-Math.exp(-BIC.KAB*tau))/BIC.SMAX; }
function bicPeakInc(g){ return BIC.DPH_MAX*g/(g+BIC.ED50); }
function bicPH(t, bicDoses, base){ let s=base; for(const d of bicDoses) s+=bicPeakInc(d.g)*bicSurge(t-d.t); return Math.min(BIC.PH_CAP, s); }
function bicSim(ldxDoses, bicDoses, base, tEnd, dt){
  tEnd=tEnd||30; dt=dt||0.025;
  const n=Math.round(tEnd/dt)+1; let G=0,L=0,A=0;
  const out={t:new Array(n), C:new Array(n), L:new Array(n), pH:new Array(n), dt:dt};
  const sd=ldxDoses.slice().sort((a,b)=>a.t-b.t); let di=0;
  for(let i=0;i<n;i++){
    const t=i*dt;
    while(di<sd.length && t>=sd[di].t-1e-9){ G+=sd[di].mg*BIC.FCONV; di++; }
    const pH=bicPH(t,bicDoses,base), ke=bicKe(pH);
    const dG=-BIC.KA*G, dL=BIC.KA*G-BIC.KC*L, dA=BIC.KC*L-ke*A;
    G+=dG*dt; L+=dL*dt; A+=dA*dt;
    out.t[i]=t; out.C[i]=A/BIC.V*1000; out.L[i]=L/BIC.V*1000; out.pH[i]=pH;
  }
  return out;
}
function bicIdx(out,h){ return Math.max(0,Math.min(out.t.length-1, Math.round(h/out.dt))); }
function bicAt(out,h){ return out.C[bicIdx(out,h)]; }
function bicAUC(out,a,b){ let s=0; const ia=bicIdx(out,a), ib=bicIdx(out,b); for(let i=ia;i<ib;i++){ s+=(out.C[i]+out.C[i+1])/2*out.dt; } return s; }
function bicCmax(out){ let m=0,th=0; for(let i=0;i<out.C.length;i++){ if(out.C[i]>m){m=out.C[i];th=out.t[i];} } return {c:m,t:th}; }
function bicMaxPH(bicDoses,base){ let m=base; for(let t=0;t<=24;t+=0.1){ const p=bicPH(t,bicDoses,base); if(p>m) m=p; } return m; }

const BIC_REGS = {

const BIC_LDX_OPTS=[20,30,40,50,70];
const BIC_BASE_OPTS=[5.0,5.5,6.0];
const BIC_SLEEP_A=23;
const BIC_INSONIA=35, BIC_PISO=18;
const BIC_REG_COLORS={taper:'--da', bid:'--gaba', even:'--slate', delay:'--crash', steady:'--accent', high:'--ach', aggr:'--na', morn:'--ht', none:'--muted'};

const BW=720, BPL=38, BPR=16, BPT=22, BPB=28;
function bicTX(h){ return BPL + (h/24)*(BW-BPL-BPR); }
function bicPX(pH){ return BPL + ((pH-4.5)/(8.5-4.5))*(BW-BPL-BPR); }
function bicYV(v,vmin,vmax,H){ const y0=H-BPB,y1=BPT,f=(v-vmin)/(vmax-vmin); return (y0-Math.max(0,Math.min(1,f))*(y0-y1)); }
function bicMark(x,y,id,color){ color=color||cssVar('--accent'); return `<g class="bann" data-note="${id}"><circle cx="${(+x).toFixed(1)}" cy="${(+y).toFixed(1)}" r="9" fill="transparent"/><circle cx="${(+x).toFixed(1)}" cy="${(+y).toFixed(1)}" r="4.6" fill="${cssVar('--card')}" stroke="${color}" stroke-width="2"/><circle cx="${(+x).toFixed(1)}" cy="${(+y).toFixed(1)}" r="1.7" fill="${color}"/></g>`; }
function bicBadge(x,y,id,color){ color=color||cssVar('--accent'); return `<g class="bann" data-note="${id}"><circle cx="${(+x).toFixed(1)}" cy="${(+y).toFixed(1)}" r="9" fill="transparent"/><circle cx="${(+x).toFixed(1)}" cy="${(+y).toFixed(1)}" r="6.6" fill="${cssVar('--card')}" stroke="${color}" stroke-width="1.4"/><text x="${(+x).toFixed(1)}" y="${(+y+3.3).toFixed(1)}" font-size="9" font-weight="800" fill="${color}" text-anchor="middle" font-family="ui-monospace,monospace">i</text></g>`; }
function bicGridT(H,vmin,vmax,yticks,ylab){

  (yticks||[]).forEach(v=>{ const y=bicYV(v,vmin,vmax,H); g+=`<line x1="${BPL}" y1="${y.toFixed(1)}" x2="${BW-BPR}" y2="${y.toFixed(1)}" stroke="${cssVar('--line')}" stroke-width="1" opacity=".55"/><text x="${BPL-5}" y="${(y+3.5).toFixed(1)}" font-size="10.5" fill="${cssVar('--muted')}" text-anchor="end" font-family="ui-monospace,monospace">${ylab?ylab(v):v}</text>`; });
  return g;

function bicGridPH(H,vmin,vmax,yticks,ylab){
  let g="", y0=H-BPB, y1=BPT;
  for(let p=5;p<=8;p+=1){ const x=bicPX(p); g+=`<line x1="${x.toFixed(1)}" y1="${y1}" x2="${x.toFixed(1)}" y2="${y0}" stroke="${cssVar('--line')}" stroke-width="1"/><text x="${x.toFixed(1)}" y="${H-9}" font-size="11.5" fill="${cssVar('--muted')}" text-anchor="middle" font-family="ui-monospace,monospace">pH ${p}</text>`; }
  (yticks||[]).forEach(v=>{ const y=bicYV(v,vmin,vmax,H); g+=`<line x1="${BPL}" y1="${y.toFixed(1)}" x2="${BW-BPR}" y2="${y.toFixed(1)}" stroke="${cssVar('--line')}" stroke-width="1" opacity=".55"/><text x="${BPL-5}" y="${(y+3.5).toFixed(1)}" font-size="10.5" fill="${cssVar('--muted')}" text-anchor="end" font-family="ui-monospace,monospace">${ylab?ylab(v):v}</text>`; });

function bicPath(out, vmin, vmax, H, key, decim){
  key=key||'C'; decim=decim||2; let d="";

  return d;
}

/* ===== pH ===== */
function bicPhSVG(bicDoses, base){
  const H=210, y0=H-BPB, y1=BPT, vmin=4.5, vmax=8.5, col=cssVar('--accent');
  const out=bicSim([],bicDoses,base,30,0.05);
  let s=`<svg class="bcchart" viewBox="0 0 ${BW} ${H}" preserveAspectRatio="none">`;
  s+=`<defs><linearGradient id="bicg_ph" x1="0" y1="${y1}" x2="0" y2="${y0}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${hexToRgba(col,.34)}"/><stop offset="1" stop-color="${hexToRgba(col,.02)}"/></linearGradient></defs>`;
  s+=bicGridT(H,vmin,vmax,[5,6,7,8],v=>v.toFixed(0));

  s+=`<rect x="${BPL}" y="${ya.toFixed(1)}" width="${(BW-BPL-BPR).toFixed(1)}" height="${(yb-ya).toFixed(1)}" fill="${cssVar('--ok')}" opacity=".10"/>`;
  s+=`<text x="${(BW-BPR-22).toFixed(1)}" y="${(ya+12).toFixed(1)}" font-size="10" font-weight="700" fill="${cssVar('--ok')}" text-anchor="end">faixa-alvo</text>`;
  const yBase=bicYV(base,vmin,vmax,H);
  s+=`<line x1="${BPL}" y1="${yBase.toFixed(1)}" x2="${BW-BPR}" y2="${yBase.toFixed(1)}" stroke="${cssVar('--slate')}" stroke-width="1.2" stroke-dasharray="4 4" opacity=".6"/><text x="${BPL+3}" y="${(yBase-4).toFixed(1)}" font-size="10" font-weight="700" fill="${cssVar('--slate')}">basal ${(""+base).replace('.',',')}</text>`;
  let d=""; let pmax=0,imax=0; for(let i=0;i<out.t.length;i++){ if(out.pH[i]>pmax){pmax=out.pH[i];imax=i;} const x=bicTX(out.t[i]), y=bicYV(out.pH[i],vmin,vmax,H); d+=(i===0?'M ':'L ')+x.toFixed(1)+' '+y.toFixed(1)+' '; }

/* ===== conversão ===== */
function bicConvSVG(ldxMg){

  function cx(h){ return BPL + (h/TEND)*(BW-BPL-BPR); }
  let cmaxA=0; for(let i=0;i<out.C.length;i++) cmaxA=Math.max(cmaxA,out.C[i]);
  const vmaxA=Math.ceil(cmaxA/10)*10;
  let s=`<svg class="bcchart" viewBox="0 0 ${BW} ${H}" preserveAspectRatio="none">`;
  for(let h=0;h<=TEND;h+=2){ const x=cx(h); s+=`<line x1="${x.toFixed(1)}" y1="${y1}" x2="${x.toFixed(1)}" y2="${y0}" stroke="${cssVar('--line')}" stroke-width="1"/><text x="${x.toFixed(1)}" y="${H-9}" font-size="11" fill="${cssVar('--muted')}" text-anchor="middle" font-family="ui-monospace,monospace">${h}h</text>`; }
  [vmaxA*0.5,vmaxA].forEach(v=>{ const y=bicYV(v,0,vmaxA,H); s+=`<line x1="${BPL}" y1="${y.toFixed(1)}" x2="${BW-BPR}" y2="${y.toFixed(1)}" stroke="${cssVar('--line')}" stroke-width="1" opacity=".5"/><text x="${BPL-5}" y="${(y+3.5).toFixed(1)}" font-size="10" fill="${cssVar('--muted')}" text-anchor="end" font-family="ui-monospace,monospace">${Math.round(v)}</text>`; });
  let lmax=0,li=0; for(let i=0;i<out.L.length;i++){ if(out.L[i]>lmax){lmax=out.L[i];li=i;} }
  let dL=""; for(let i=0;i<out.t.length;i++){ const x=cx(out.t[i]), y=bicYV(out.L[i]/lmax*vmaxA,0,vmaxA,H); dL+=(i===0?'M ':'L ')+x.toFixed(1)+' '+y.toFixed(1)+' '; }
  let dA=""; for(let i=0;i<out.t.length;i++){ const x=cx(out.t[i]), y=bicYV(out.C[i],0,vmaxA,H); dA+=(i===0?'M ':'L ')+x.toFixed(1)+' '+y.toFixed(1)+' '; }
  s+=`<path d="${dL}" fill="none" stroke="${cssVar('--gaba')}" stroke-width="2.2" stroke-dasharray="5 3" stroke-linecap="round"/>`;
  s+=`<path d="${dA}" fill="none" stroke="${cssVar('--da')}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
  const tmL=out.t[li], cmA=bicCmax(out);
  [[tmL,cssVar('--gaba')],[cmA.t,cssVar('--da')]].forEach(p=>{ const x=cx(p[0]); s+=`<line x1="${x.toFixed(1)}" y1="${y1}" x2="${x.toFixed(1)}" y2="${y0}" stroke="${p[1]}" stroke-width="1" stroke-dasharray="2 3" opacity=".5"/>`; });
  s+=`<text x="${cx(tmL).toFixed(1)}" y="${(y1+11).toFixed(1)}" font-size="10" font-weight="700" fill="${cssVar('--gaba')}" text-anchor="middle">Tmax LDX ${tmL.toFixed(1).replace('.',',')}h</text>`;
  s+=`<text x="${cx(cmA.t).toFixed(1)}" y="${(y1+11).toFixed(1)}" font-size="10" font-weight="700" fill="${cssVar('--da')}" text-anchor="middle">Tmax dexanf. ${cmA.t.toFixed(1).replace('.',',')}h</text>`;
  s+=bicMark(cx(tmL), bicYV(vmaxA,0,vmaxA,H), 'conv_ldx', cssVar('--gaba'));
  s+=bicMark(cx(cmA.t), bicYV(cmA.c,0,vmaxA,H), 'conv_amph', cssVar('--da'));
  s+=`</svg>`;
  return s;
}

function bicDoseMinSVG(base){

  const reg=BIC_REGS.steady.doses;

  const vals=doses.map(mg=>bicAUC(bicSim([{t:7,mg:mg}],reg,base,26,0.05),7,22));
  const vmax=Math.ceil(Math.max(ref,Math.max.apply(null,vals))/100)*100;
  function dx(mg){ return BPL + ((mg-10)/(75-10))*(BW-BPL-BPR); }
  let s=`<svg class="bcchart" viewBox="0 0 ${BW} ${H}" preserveAspectRatio="none">`;
  for(const mg of [20,30,40,50,60,70]){ const x=dx(mg); s+=`<line x1="${x.toFixed(1)}" y1="${y1}" x2="${x.toFixed(1)}" y2="${y0}" stroke="${cssVar('--line')}" stroke-width="1"/><text x="${x.toFixed(1)}" y="${H-9}" font-size="11" fill="${cssVar('--muted')}" text-anchor="middle" font-family="ui-monospace,monospace">${mg}</text>`; }
  [vmax*0.5,vmax].forEach(v=>{ const y=bicYV(v,0,vmax,H); s+=`<line x1="${BPL}" y1="${y.toFixed(1)}" x2="${BW-BPR}" y2="${y.toFixed(1)}" stroke="${cssVar('--line')}" stroke-width="1" opacity=".5"/><text x="${BPL-5}" y="${(y+3.5).toFixed(1)}" font-size="10" fill="${cssVar('--muted')}" text-anchor="end" font-family="ui-monospace,monospace">${Math.round(v)}</text>`; });
  const yr=bicYV(ref,0,vmax,H);
  s+=`<line x1="${BPL}" y1="${yr.toFixed(1)}" x2="${BW-BPR}" y2="${yr.toFixed(1)}" stroke="${cssVar('--slate')}" stroke-width="1.6" stroke-dasharray="6 4"/><text x="${BPL+4}" y="${(yr-5).toFixed(1)}" font-size="10.5" font-weight="700" fill="${cssVar('--slate')}">70 mg sem bicarb (alvo)</text>`;
  let d=""; doses.forEach((mg,i)=>{ const x=dx(mg), y=bicYV(vals[i],0,vmax,H); d+=(i===0?'M ':'L ')+x.toFixed(1)+' '+y.toFixed(1)+' '; });
  s+=`<path d="${d}" fill="none" stroke="${cssVar('--da')}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`;
  doses.forEach((mg,i)=>{ const x=dx(mg), y=bicYV(vals[i],0,vmax,H); s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${cssVar('--da')}"/>`; });
  let cross=null; for(let i=1;i<doses.length;i++){ if((vals[i-1]-ref)*(vals[i]-ref)<=0){ const f=(ref-vals[i-1])/(vals[i]-vals[i-1]); cross=doses[i-1]+f*(doses[i]-doses[i-1]); break; } }
  if(cross){ const x=dx(cross); s+=bicMark(x,yr,'dm_cross',cssVar('--ok'))+`<text x="${x.toFixed(1)}" y="${(yr+19).toFixed(1)}" font-size="10.5" font-weight="800" fill="${cssVar('--ok')}" text-anchor="middle">≈ ${cross.toFixed(0)} mg</text>`; }

  s+=`</svg>`;
  return {svg:s, cross:cross, ref:ref};

  th_alc:{h:"t½ ~21 h (alcalino)", b:"Reabsorção quase total prolonga muito a meia-vida — retém o fármaco, mas arrisca acúmulo e insônia.", r:"Modelo (Huang 2020); t½ alongada sob alcalinização (Beckett et al. 1969)"},
  auc_opt:{h:"Alvo pH ≈ 7,5", b:"Acima de ~7,5 a CLr já é mínima; subir o pH adiante rende <2% de AUC. Melhor custo-benefício antes de mais carga de sódio.", r:"Métrica do modelo: AUC simulada 07–22h. Sem referência clínica para o alvo — leitura do ponto de saturação"},
  auc_curve:{h:"Exposição vs pH", b:"AUC diurna (07–22h) da dexanfetamina se o pH fosse mantido fixo no valor do eixo.", r:"Métrica: integral de C(t) no modelo"},
  dm_cross:{h:"≈ 50 mg equivalem a 70 mg", b:"Com alcalinização diurna, 50 mg de lisdexanfetamina dão a mesma AUC diurna que 70 mg em urina ácida.", r:"Métrica: igualdade de AUC 07–22h. Razão de depuração ácido/alcalino 3,2× (Huang 2020)"},
  dm_ref:{h:"Referência: 70 mg sem bicarbonato", b:"Exposição diurna do esquema atual (urina ácida), que é o que obriga a dose alta.", r:"Modelo (Huang et al. 2020)"},
  fex:{h:"Fração excretada inalterada", b:"Parte da dose que sai intacta na urina = CLr/(CLr+CLh). O resto é metabolizado no fígado.", r:"Modelo (Huang et al. 2020): CLh 7,41 L/h fixo"},
  reg_ins:{h:"Limiar de insônia (ilustrativo)", b:"Linha de referência; o regime contínuo a ultrapassa à noite, mantendo nível alto na hora de dormir.", r:"Limiar didático (35 ng/mL), ajustável"},
  reg_taper:{h:"Taper diurno (recomendado)", b:"Bicarbonato concentrado de manhã, dose menor à tarde, nada após ~13–16 h: alto de dia, desce suave à noite.", r:"Desenho derivado da curva CLr(pH) de Huang et al. 2020"}
};

/* ===== RENDER PRINCIPAL ===== */
function renderBicarb(){
  if(State.bicLdx==null) State.bicLdx=70;
  if(State.bicBase==null) State.bicBase=5.5;
  if(State.bicReg==null) State.bicReg='taper';
  injectBicCSS();
  const ldxMg=State.bicLdx, base=State.bicBase, reg=BIC_REGS[State.bicReg];
  const ldxDoses=[{t:7,mg:ldxMg}], bicDoses=reg.doses;
  const sim=bicSim(ldxDoses,bicDoses,base,30,0.025);
  const baseSim=bicSim(ldxDoses,[],base,30,0.025);
  const m=bicMetrics(sim), mb=bicMetrics(baseSim);
  const dm=bicDoseMinSVG(base);
  const tHalfBase=bicThalf(base), tHalfPeak=bicThalf(bicMaxPH(bicDoses,base));

  const ldxChips=BIC_LDX_OPTS.map(v=>`<button class="bschip ${v===ldxMg?'on':''}" data-bldx="${v}">${v} mg</button>`).join("");
  const baseChips=BIC_BASE_OPTS.map(v=>`<button class="bschip ${v===base?'on':''}" data-bbase="${v}">pH ${(""+v).replace('.',',')}</button>`).join("");
  const regChips=Object.keys(BIC_REGS).map(k=>`<button class="bschip ${k===State.bicReg?'on':''}" data-breg="${k}">${BIC_REGS[k].chip}</button>`).join("");

  const intro=`<div class="bintro">Esta aba modela a <b>concentração plasmática de dexanfetamina</b> (não a curva de efeito das outras abas) e como o <b>bicarbonato de sódio</b>, ao alcalinizar a urina, reduz a excreção renal e <b>retém</b> a anfetamina. Paciente com <b>urina ácida</b> excreta muita dexanfetamina — daí a necessidade de doses altas. Cadeia modelada: <b>lisdexanfetamina → conversão → dexanfetamina → eliminação dependente do pH</b>. <span class="bhint">Toque nos pontos ⓘ dos gráficos para ver a explicação e a referência.</span> Tudo <b>hipotético e ilustrativo</b>.</div>`;

  const fmtT=t=>String(Math.floor(t)).padStart(2,'0')+":"+String(Math.round((t%1)*60)).padStart(2,'0');
  const controls=`
    <div class="bctl">
      <div class="bctl-row"><span class="bctl-l">Lisdexanfetamina (dose única, 07h)</span><div class="bschips" id="bic-ldx">${ldxChips}</div></div>
      <div class="bctl-row"><span class="bctl-l">pH urinário basal (sem bicarbonato)</span><div class="bschips" id="bic-base">${baseChips}</div></div>
      <div class="bctl-row"><span class="bctl-l">Regime de bicarbonato</span><div class="bschips bschips-wrap" id="bic-reg">${regChips}</div></div>
      <div class="bctl-sched">${reg.doses.length?('Doses: '+reg.doses.map(d=>`<b>${(""+d.g).replace('.',',')} g · ${fmtT(d.t)}</b>`).join(' · ')):'<b>sem bicarbonato</b>'}</div>
    </div>`;

  const hero=`<div class="bcard">
    <div class="bc-t">Dexanfetamina ao longo do dia</div>
    <div class="bc-s">Linha cheia = com o regime selecionado · tracejada = sem bicarbonato (basal ácido). Toque/arraste o gráfico.</div>
    <div class="bleg"><span><i class="lg-da"></i>com bicarbonato</span><span><i class="lg-dash-da"></i>sem bicarbonato</span><span><i class="lg-warn"></i>teto p/ dormir</span><span><i class="lg-crash"></i>piso/crash</span></div>
    <div class="btap" id="bic-hero-wrap">${bicHeroSVG(sim,baseSim,ldxDoses,bicDoses)}</div>
    <div class="bcur" id="bic-readout">${bicReadout(sim,baseSim)}</div>
    <div class="bc-met">
      <div><span>Pico (Cmax)</span><b>${bicF(m.cmax,0)} <i>ng/mL · ${bicF(m.tmax,1)}h</i></b></div>
      <div><span>Exposição diurna</span><b>${bicF(m.aucDia/mb.aucDia,2)}× <i>vs basal</i></b></div>
      <div><span>t½ sem bicarbonato</span><b>${bicF(tHalfBase,1)} <i>h</i></b></div>
      <div><span>t½ com bicarbonato (pico)</span><b>${bicF(tHalfPeak,0)} <i>h</i></b></div>
      <div><span>Nível às 13h</span><b>${bicF(m.c13,0)} <i>ng/mL</i></b></div>
      <div><span>Nível às 22h</span><b>${bicF(m.c22,0)} <i>ng/mL</i></b></div>
    </div>
  </div>`;

  const phCard=`<div class="bcard"><div class="bc-t">pH urinário moldado pelo bicarbonato</div><div class="bc-s">Cada dose gera um surto (pico ~1,5 h, dura 6–8 h); somam-se e o pH é limitado em ~8,3. A <b>faixa-alvo 7,3–8,0</b> já quase zera a excreção renal.</div>${bicPhSVG(bicDoses,base)}</div>`;

  const thDayCard=`<div class="bcard"><div class="bc-t">Meia-vida da dexanfetamina ao longo do dia</div><div class="bc-s">Resposta direta: <b>com bicarbonato</b> (linha cheia) a t½ sobe nas horas alcalinizadas; <b>sem bicarbonato</b> (tracejada) fica plana na basal. t½ basal <b>${bicF(tHalfBase,1)} h</b> → pico <b>${bicF(tHalfPeak,0)} h</b>.</div>${bicThalfDaySVG(bicDoses,base)}</div>`;

  const convCard=`<div class="bcard"><div class="bc-t">Conversão lisdexanfetamina → dexanfetamina</div><div class="bc-s">O pró-fármaco (tracejado roxo, normalizado) é hidrolisado e <b>forma</b> a dexanfetamina (azul). É a metabolização que antecede o efeito — modelada explicitamente.</div>${bicConvSVG(ldxMg)}<div class="bleg"><span><i class="lg-dash-gaba"></i>lisdexanfetamina intacta</span><span><i class="lg-da"></i>dexanfetamina formada</span></div></div>`;

  const q1=`<div class="bsec">Pergunta 1 · Qual pH manter para otimizar?</div>
    <div class="bcard"><div class="bc-t">Exposição diurna conforme o pH-alvo</div><div class="bc-s">AUC da dexanfetamina (07–22h) se o pH fosse mantido fixo. A curva <b>satura</b>: de 5,5 para 7,5 quase dobra; de 7,5 para 8,0 ganha &lt;2%.</div>${bicAucSVG(ldxMg)}
    <div class="bnote"><b>Resposta.</b> O alvo ótimo é <b>pH ≈ 7,5</b> — captura ~98% da retenção possível, com a depuração renal já praticamente nula (CLr ~1,5 L/h). Empurrar acima de 7,5 rende pouco e exige mais bicarbonato (mais sódio/alcalose). Para sustentar 7,5 ao longo do dia, o esquema <b>estável 3×</b> (3+3+2 g) ou o <b>taper</b> bastam (ver o gráfico de pH).</div></div>`;

  const q2=`<div class="bsec">Pergunta 2 · Menor dose de lisdexanfetamina possível</div>
    <div class="bcard"><div class="bc-t">Dose de LDX + bicarbonato que iguala 70 mg sem bicarbonato</div><div class="bc-s">Linha tracejada = exposição diurna de <b>70 mg em urina ácida</b> (cenário atual, que força doses altas). A curva azul é a exposição com <b>dose menor + bicarbonato estável</b>.</div>${dm.svg}
    <div class="bnote"><b>Resposta.</b> Com bicarbonato mantendo o pH diurno alto, <b>≈ ${dm.cross?dm.cross.toFixed(0):'50'} mg</b> de lisdexanfetamina entregam a <b>mesma exposição diurna</b> de 70 mg sem alcalinização. O teto teórico (pH fixo em 7,5 o dia todo) é menor: a razão de depuração ácido/alcalino é <b>${bicF((BIC.CLH+bicCLr(5.5))/(BIC.CLH+bicCLr(7.5)),1)}×</b>, ou seja a dose poderia cair até ~${Math.round((BIC.CLH+bicCLr(7.5))/(BIC.CLH+bicCLr(5.5))*100)}% em estado ideal. Na prática o regime não fica no teto o dia inteiro, então ~50 mg é o número realista.</div></div>`;

  const c2aggr=bicAt(bicSim([{t:7,mg:ldxMg}],BIC_REGS.aggr.doses,base,30,0.04),26);
  const q3=`<div class="bsec">Pergunta 3 · Formulação dia/noite para os 70 mg <span class="bstar">a mais importante</span></div>
    <div class="bcard"><div class="bc-t">Comparação de regimes de bicarbonato</div><div class="bc-s">Alta de manhã/tarde, baixa à noite (sono) e <b>descida suave</b> (sem crash). Linhas: <span style="color:${cssVar('--da')};font-weight:700">taper</span>, <span style="color:${cssVar('--gaba')};font-weight:700">2×</span>, <span style="color:${cssVar('--slate')};font-weight:700">3+3</span>, <span style="color:${cssVar('--crash')};font-weight:700">atrasado</span>, <span style="color:${cssVar('--accent')};font-weight:700">estável</span>, <span style="color:${cssVar('--ach')};font-weight:700">alto</span>, <span style="color:${cssVar('--na')};font-weight:700">contínuo</span>, <span style="color:${cssVar('--ht')};font-weight:700">só manhã</span>, <span style="color:${cssVar('--muted')};font-weight:700">sem bicarb</span>.</div>${bicRegimesSVG(ldxMg,base)}
    <table class="btab"><thead><tr><th>regime</th><th>13h</th><th>18h</th><th>22h</th><th>02h</th></tr></thead><tbody>
      ${['taper','bid','even','delay','steady','high','aggr','morn','none'].map(k=>{ const o=bicSim([{t:7,mg:ldxMg}],BIC_REGS[k].doses,base,30,0.04); return `<tr><td style="color:${cssVar(BIC_REG_COLORS[k])};font-weight:700">${BIC_REGS[k].chip}</td><td>${bicF(bicAt(o,13),0)}</td><td>${bicF(bicAt(o,18),0)}</td><td>${bicF(bicAt(o,22),0)}</td><td>${bicF(bicAt(o,26),0)}</td></tr>`; }).join("")}
    </tbody></table>
    <div class="bnote"><b>Resposta.</b> O melhor desenho é um <b>taper diurno</b>: bicarbonato junto da dose das 07h e mais uma de manhã, uma <b>dose menor no início da tarde</b> e <b>nada depois das ~13–16h</b>. De manhã/tarde a dexanfetamina fica tão alta quanto no regime contínuo; à noite, sem bicarbonato, a urina <b>volta a ácida</b>, a depuração renal sobe e o nível cai — mas de forma <b>controlada</b>, porque o taper faz o pH descer aos poucos (descida sem precipício). O regime <b>2×</b> (3 g manhã + 2 g tarde) é uma versão mais simples com perfil parecido. O <b>atrasado</b> (bicarbonato só às 09h e 14h, com o Vyvanse ainda às 07h) deixa a urina ácida nas primeiras ~2 h e só então alcaliniza, deslocando a retenção para o platô da tarde e sustentando um pouco mais o fim do dia. O <b>contínuo</b> mantém ~${bicF(c2aggr,0)} ng/mL às 02h → <b>insônia</b>; o <b>sem bicarbonato</b> cobre pouco a tarde. O <b>afrouxar</b> que você descreveu é exatamente a dose menor da tarde.</div></div>`;

  const refCards=`<div class="bsec">Farmacocinética de apoio</div>
    <div class="bcard bcard-mini"><div class="bc-t">Depuração renal vs pH</div><div class="bc-s">Cai de ~23 para ~1 L/h entre pH 5 e 8 (pontos = âncoras de Huang 2020).</div>${bicClrSVG(base,bicDoses)}</div>
    <div class="bcard bcard-mini"><div class="bc-t">Meia-vida da dexanfetamina vs pH</div><div class="bc-s">~6 h (ácido) → ~21 h (alcalino). É a base da retenção.</div>${bicThalfSVG()}</div>
    <div class="bcard bcard-mini"><div class="bc-t">Fração da dose excretada inalterada</div><div class="bc-s">Quanto sai intacto na urina conforme o pH (o resto é metabolizado).</div>${bicFexSVG()}</div>`;

  const disc=`<div class="disclaimer"><b>Aviso.</b> Modelo hipotético e educacional, para apoio de raciocínio clínico e ensino — <b>não é prescrição</b>. A coadministração de bicarbonato para modular anfetamina <b>não é prática padrão</b> e tem riscos próprios (sobrecarga de sódio, alcalose metabólica, efeito sobre outros fármacos). Parâmetros calibrados em Huang, Czuba &amp; Isoherranen 2020 e na literatura de alcalinização urinária; o eixo de concentração é estimativa. Qualquer decisão é com o médico assistente.</div>`;

  const noteCard=`<div class="bnotecard" id="bic-note"><button class="bn-x" id="bic-note-x" aria-label="fechar">×</button><div class="bn-h" id="bic-note-h"></div><div class="bn-b" id="bic-note-b"></div><div class="bn-r" id="bic-note-r"></div></div>`;

  document.getElementById("view").innerHTML=`<div class="fade">${intro}${controls}${hero}${phCard}${thDayCard}${convCard}${q1}${q2}${q3}${refCards}${disc}</div>${noteCard}`;
  bicBindHero(sim,baseSim);
  bicBindControls();
}

function bicReadout(sim,baseSim){
  const h=(State.bicCursor==null)?13:State.bicCursor;
  const c=bicAt(sim,h), cb=bicAt(baseSim,h), pH=bicPH(h,BIC_REGS[State.bicReg].doses,State.bicBase);
  const hh=String(Math.floor(h)).padStart(2,'0')+":"+String(Math.round((h%1)*60)).padStart(2,'0');
  return `<div class="bcur-h">${hh}</div><div class="bcur-v"><span>dexanf. <b>${bicF(c,0)}</b> ng/mL</span><span>sem bicarb <b>${bicF(cb,0)}</b></span><span>pH <b>${bicF(pH,2)}</b></span><span>t½ <b>${bicF(bicThalf(pH),1)}</b> h</span></div>`;
}

let bicDragging=false;
function bicBindHero(sim,baseSim){
  const svg=document.getElementById("bic-hero");
  if(!svg) return;
  function pick(ev){
    if(ev.target && ev.target.closest && ev.target.closest(".bann")) return;
    const r=svg.getBoundingClientRect();
    const cx=(ev.touches&&ev.touches[0]?ev.touches[0].clientX:ev.clientX)-r.left;
    let h=(cx/r.width*BW - BPL)/(BW-BPL-BPR)*24;
    h=Math.max(0,Math.min(24,h)); State.bicCursor=Math.round(h*4)/4;
    const cur=document.getElementById("bic-cur"); if(cur) cur.innerHTML=bicHeroCursor(sim);
    const ro=document.getElementById("bic-readout"); if(ro) ro.innerHTML=bicReadout(sim,baseSim);
  }
  svg.addEventListener("mousedown",e=>{ bicDragging=true; pick(e); });
  svg.addEventListener("mousemove",e=>{ if(bicDragging) pick(e); });
  svg.addEventListener("touchstart",e=>{ pick(e); },{passive:true});
  svg.addEventListener("touchmove",e=>{ pick(e); },{passive:true});
}
document.addEventListener("mouseup",()=>{ bicDragging=false; });

function bicShowNote(id){
  const n=BIC_NOTES[id]; if(!n) return;
  const card=document.getElementById("bic-note"); if(!card) return;
  document.getElementById("bic-note-h").textContent=n.h;
  document.getElementById("bic-note-b").textContent=n.b;
  const r=document.getElementById("bic-note-r");
  if(n.r){ r.innerHTML="<b>Referência / métrica:</b> "+esc(n.r); r.style.display=""; } else { r.style.display="none"; }
  card.classList.add("show");
}
function bicHideNote(){ const c=document.getElementById("bic-note"); if(c) c.classList.remove("show"); }
/* handler global (registrado uma vez) */
document.addEventListener("click",e=>{
  const m=e.target.closest && e.target.closest(".bann");
  if(m){ bicShowNote(m.dataset.note); e.stopPropagation(); return; }
  if(State.tab==="bicarb"){ if(!(e.target.closest && e.target.closest("#bic-note"))) bicHideNote(); }
});

function bicBindControls(){
  document.querySelectorAll("#bic-ldx [data-bldx]").forEach(b=>b.onclick=()=>{ const v=+b.dataset.bldx; if(State.bicLdx===v) return; State.bicLdx=v; renderBicarb(); });
  document.querySelectorAll("#bic-base [data-bbase]").forEach(b=>b.onclick=()=>{ const v=+b.dataset.bbase; if(State.bicBase===v) return; State.bicBase=v; renderBicarb(); });
  document.querySelectorAll("#bic-reg [data-breg]").forEach(b=>b.onclick=()=>{ const v=b.dataset.breg; if(State.bicReg===v) return; State.bicReg=v; renderBicarb(); });
  const x=document.getElementById("bic-note-x"); if(x) x.onclick=(ev)=>{ ev.stopPropagation(); bicHideNote(); };
}

/* ============================================================ PONTE BICARBONATO -> NEUROQUÍMICA ============================================================
   A dexanfetamina (modelo BIC, concentração plasmática) governa a liberação de DA/NA. A curva de
   estado estacionário (vários dias, taper relativo ao início) é convertida em unidades de efeito do
   gráfico principal, calibrada para que 70 mg SEM bicarbonato mantenha o pico antigo (DA 1,00 / NA 0,90).
   Assim, 50 mg + bicarbonato mostra pico semelhante porém tarde/noite muito mais sustentada. */
const BIC_TAPER_REL=[[0,3],[3.5,2],[6,1]];  // taper relativo ao horário de início (h após a dose, g)
let _bicCurveCache={}, _bicRef=null;
function bicNeuroCurve(ldxMg, startH, base, bicRel){
  const key=ldxMg+"|"+(+startH).toFixed(2)+"|"+base+"|"+(bicRel?bicRel.length:0);
  if(_bicCurveCache[key]) return _bicCurveCache[key];
  const ND=6, dt=0.05, ldx=[], bic=[];
  for(let d=0; d<ND; d++){ const day=d*24; ldx.push({t:startH+day, mg:ldxMg}); (bicRel||[]).forEach(r=>bic.push({t:startH+r[0]+day, g:r[1]})); }
  const sim=bicSim(ldx,bic,base,ND*24,dt);
  const day0=(ND-1)*24, n=Math.round(24/dt), C=new Array(n+1);
  for(let i=0;i<=n;i++) C[i]=sim.C[Math.round((day0+i*dt)/dt)];
  const obj={C,dt,n}; _bicCurveCache[key]=obj; return obj;

function bicNeuroAt(c,tH){ let t=((tH%24)+24)%24; return c.C[Math.min(c.n,Math.max(0,Math.round(t/c.dt)))]; }
function bicRefCmax(){ if(_bicRef!=null) return _bicRef; const c=bicNeuroCurve(70,7,5.5,null); _bicRef=Math.max.apply(null,c.C)||1; return _bicRef; }
function bicEffContrib(med, ntKey, tH, startH){ if(ntKey!=='DA'&&ntKey!=='NA') return 0; const c=bicNeuroCurve(med.bicMg||50, startH, med.bicBase||5.5, BIC_TAPER_REL); const scale=(ntKey==='DA'?1.00:0.90)/bicRefCmax(); return scale*bicNeuroAt(c,tH); }

/* Faixa de platô de eficácia da lisdexanfetamina (Nourredine et al., Lancet Psychiatry 2026, análise S12):
   a eficácia satura entre ~55 mg e 70 mg nativos (≈25 a 31,5 mg dextroanfetamina-equiv.), SMD ~−1,05.
   Traduz essa faixa de DOSE para a faixa de DOPAMINA total que essas doses produziriam (lisdex pura, sem
   bicarbonato, mantendo base circadiana e bupropiona), para comparar com a curva atual do dia. */

    return mx; }

}

/* ============================================================ HELPERS ============================================================ */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtNum(v){ if(v==null||isNaN(v)) return "—"; const abs=Math.abs(v); const dec = (abs!==0 && abs<10 && !Number.isInteger(v))?2:(!Number.isInteger(v)?1:0); return v.toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:dec}); }
function fmtDM(ymdStr){ const [y,m,d]=ymdStr.split("-"); return d+"/"+m; }
function fmtDMY(ymdStr){ const [y,m,d]=ymdStr.split("-"); return d+"/"+m+"/"+y; }

const EX_CATS=["Hormonal","Tireoide","Metabólico","Lipídico","Renal/Hepático","Hemograma"];
function exById(id){ return State.exams.find(e=>e.id===id); }
function exSorted(p){ return p.pts.slice().sort((a,b)=>a[0]<b[0]?-1:1); }
function exLast(p){ const s=exSorted(p); return s[s.length-1]; }
function exPrev(p){ const s=exSorted(p); return s.length>1?s[s.length-2]:null; }
function exInRange(p,v){ if(v==null) return true; if(p.lo!=null && v<p.lo) return false; if(p.hi!=null && v>p.hi) return false; return true; }
function exTrend(p){ const last=exLast(p), prev=exPrev(p); if(!prev) return 0; const d=last[1]-prev[1]; const span=Math.abs(prev[1])||1; if(Math.abs(d)/span<0.02) return 0; return d>0?1:-1; }
function trendIcon(t){ if(t===0) return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>`; if(t>0) return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16l7-7 7 7"/></svg>`; return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l7 7 7-7"/></svg>`; }

function exMiniSpark(p){ const s=exSorted(p); if(s.length<2) return `<svg class="exspark" viewBox="0 0 60 22"></svg>`;
  const vals=s.map(x=>x[1]), mn=Math.min(...vals), mx=Math.max(...vals), rng=(mx-mn)||1;
  const X=i=>4+(i/(s.length-1))*52, Y=v=>18-((v-mn)/rng)*14; let d="";
  s.forEach((pt,i)=>{ d+=(i===0?"M":"L")+X(i).toFixed(1)+" "+Y(pt[1]).toFixed(1)+" "; });
  const lastOut=!exInRange(p,s[s.length-1][1]);
  return `<svg class="exspark" viewBox="0 0 60 22"><path d="${d}" fill="none" stroke="var(--slate)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(s.length-1).toFixed(1)}" cy="${Y(s[s.length-1][1]).toFixed(1)}" r="2.4" fill="${lastOut?'var(--warn)':'var(--accent)'}"/></svg>`; }

const EXG={W:720,H:300,padL:52,padR:14,padT:20,padB:34};
function exChartSVG(p, selIdx){
  const g=EXG, s=exSorted(p), n=s.length;
  const x0=g.padL,x1=g.W-g.padR,y0=g.H-g.padB,y1=g.padT;
  const dates=s.map(pt=>parseYmd(pt[0]).getTime()), dmin=Math.min(...dates), dmax=Math.max(...dates), dspan=(dmax-dmin)||1;
  const X = n===1 ? (()=> (x0+x1)/2) : (t=> x0+((t-dmin)/dspan)*(x1-x0));
  const vals=s.map(pt=>pt[1]); let lo=p.lo, hi=p.hi;
  let vmin=Math.min(...vals), vmax=Math.max(...vals);
  if(lo!=null){ vmin=Math.min(vmin,lo); } if(hi!=null){ vmax=Math.max(vmax,hi); }
  const pad=(vmax-vmin)*0.18 || Math.abs(vmax)*0.15 || 1; vmin-=pad; vmax+=pad; if(vmin>0 && vmin<pad*1.2) vmin=0;
  const vspan=(vmax-vmin)||1; const Y=v=>y0-((v-vmin)/vspan)*(y0-y1);
  // faixa de referência
  let band=""; if(lo!=null||hi!=null){ const yb=Y(hi!=null?Math.min(hi,vmax):vmax), yt=Y(lo!=null?Math.max(lo,vmin):vmin);
    band=`<rect x="${x0}" y="${yb.toFixed(1)}" width="${x1-x0}" height="${Math.max(0,(yt-yb)).toFixed(1)}" fill="${hexToRgba(cssVar('--ok'),.10)}"/>`;
    if(lo!=null) band+=`<line x1="${x0}" y1="${Y(lo).toFixed(1)}" x2="${x1}" y2="${Y(lo).toFixed(1)}" stroke="${hexToRgba(cssVar('--ok'),.55)}" stroke-width="1" stroke-dasharray="3 3"/>`;
    if(hi!=null) band+=`<line x1="${x0}" y1="${Y(hi).toFixed(1)}" x2="${x1}" y2="${Y(hi).toFixed(1)}" stroke="${hexToRgba(cssVar('--ok'),.55)}" stroke-width="1" stroke-dasharray="3 3"/>`;
  }
  // eixos / labels Y (vmin, ref, vmax)
  const yticks=[]; const addT=v=>{ if(v!=null && !yticks.some(t=>Math.abs(t-v)<vspan*0.04)) yticks.push(v); };
  addT(lo); addT(hi); if(!yticks.length){ addT(vmin+vspan*0.2); addT(vmax-vspan*0.2); }
  let grid=""; yticks.forEach(v=>{ const yy=Y(v); grid+=`<line x1="${x0}" y1="${yy.toFixed(1)}" x2="${x1}" y2="${yy.toFixed(1)}" stroke="${cssVar('--line')}" stroke-width="1"/><text x="${x0-8}" y="${(yy+4).toFixed(1)}" font-size="12" fill="${cssVar('--muted')}" text-anchor="end" font-family="ui-monospace,monospace">${fmtNum(v)}</text>`; });
  // x labels (datas) — primeira, última e algumas no meio
  let xl=""; const idxsToLabel = n<=4 ? s.map((_,i)=>i) : [0, Math.round((n-1)/2), n-1];
  idxsToLabel.forEach(i=>{ const xx=X(dates[i]); xl+=`<text x="${xx.toFixed(1)}" y="${g.H-10}" font-size="12" fill="${cssVar('--muted')}" text-anchor="middle" font-family="ui-monospace,monospace">${fmtDM(s[i][0])}</text>`; });
  // linha + área
  let line="", area="";
  s.forEach((pt,i)=>{ const px=X(dates[i]).toFixed(1), py=Y(pt[1]).toFixed(1); line+=(i===0?"M":"L")+px+" "+py+" "; area+=(i===0?("M"+px+" "+y0+" L"+px+" "+py+" "):("L"+px+" "+py+" ")); });
  if(n>1){ area+=`L ${X(dates[n-1]).toFixed(1)} ${y0} Z`; }
  const curve = n>1 ? `<path d="${area}" fill="${hexToRgba(cssVar('--accent'),.10)}"/><path d="${line}" fill="none" stroke="${cssVar('--accent')}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>` : "";
  // pontos
  let dots=""; s.forEach((pt,i)=>{ const px=X(dates[i]), py=Y(pt[1]); const out=!exInRange(p,pt[1]); const isSel=i===selIdx;
    dots+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${isSel?6:4}" fill="${out?cssVar('--warn'):cssVar('--accent')}" stroke="${cssVar('--card')}" stroke-width="2"/>`; });
  // cursor + tooltip
  let tip=""; if(selIdx!=null && s[selIdx]){ const px=X(dates[selIdx]), py=Y(s[selIdx][1]);
    tip+=`<line x1="${px.toFixed(1)}" y1="${y1}" x2="${px.toFixed(1)}" y2="${y0}" stroke="${cssVar('--ink')}" stroke-width="1.4" stroke-dasharray="2 3" opacity=".5"/>`;
    const txt=fmtNum(s[selIdx][1])+" "+p.un, dt=fmtDMY(s[selIdx][0]); const wBox=Math.max(txt.length,dt.length)*7.3+18;
    const bx=Math.min(Math.max(px-wBox/2, x0), x1-wBox);
    tip+=`<g><rect x="${bx.toFixed(1)}" y="${(py-46).toFixed(1)}" width="${wBox.toFixed(0)}" height="38" rx="7" fill="${cssVar('--ink')}"/><text x="${(bx+wBox/2).toFixed(1)}" y="${(py-29).toFixed(1)}" font-size="13" font-weight="700" fill="${cssVar('--bg')}" text-anchor="middle" font-family="ui-monospace,monospace">${esc(txt)}</text><text x="${(bx+wBox/2).toFixed(1)}" y="${(py-13).toFixed(1)}" font-size="11" fill="${cssVar('--muted')}" text-anchor="middle" font-family="ui-monospace,monospace">${dt}</text></g>`; }
  return `<svg class="exsvg" id="exsvg" viewBox="0 0 ${g.W} ${g.H}" aria-label="Histórico de ${esc(p.nome)}">${band}${grid}${curve}${dots}${tip}</svg>`;
}

/* ----- medidor de testosterona ao longo do ciclo ----- */
const TM={W:330,H:96,padL:8,padR:8,padT:12,padB:20};
function testoMeterSVG(interval, todayD, cursorD){
  const g=TM, x0=g.padL,x1=g.W-g.padR,y0=g.H-g.padB,y1=g.padT, N=120, dose=find("testo").mlPorDose||0.75;
  let vmax=-1e9, vmin=1e9; const ys=[];
  for(let i=0;i<=N;i++){ const d=(i/N)*interval; const v=testoEstimate(d,dose); ys.push(v); vmax=Math.max(vmax,v); vmin=Math.min(vmin,v); }
  const pad=(vmax-vmin)*0.16||1; vmin-=pad; vmax+=pad; const span=(vmax-vmin)||1;
  const X=d=>x0+(d/interval)*(x1-x0), Y=v=>y0-((v-vmin)/span)*(y0-y1);
  let line="",area=`M ${X(0)} ${y0} `;
  for(let i=0;i<=N;i++){ const d=(i/N)*interval, px=X(d).toFixed(1), py=Y(ys[i]).toFixed(1); line+=(i===0?"M":"L")+px+" "+py+" "; area+=`L ${px} ${py} `; }
  area+=`L ${X(interval)} ${y0} Z`;
  let ticks=""; for(let d=0;d<=interval;d++){ const px=X(d); ticks+=`<text x="${px.toFixed(1)}" y="${g.H-6}" font-size="10" fill="${cssVar('--muted')}" text-anchor="middle" font-family="ui-monospace,monospace">${d}</text>`; }

  const em=/Data da Entrada[\s.:]*?(\d{2})\/(\d{2})\/(\d{4})/.exec(text); return {dates:out, entrada: em?em[3]+"-"+em[2]+"-"+em[1]:null}; }
function dateForPos(info, pos){ let best=null; info.dates.forEach(d=>{ if(d.idx<=pos && (!best || d.idx>best.idx)) best=d; }); return best?best.ymd : (info.entrada || ymd(new Date())); }
function parseLabText(text){ const info=collectDates(text); const found=[]; const seen=new Set();
  PATT.forEach(([id,re])=>{ const m=re.exec(text); if(!m) return; const val=brNum(m[1]); if(isNaN(val)) return; const pos=m.index+m[0].length; const date=dateForPos(info,pos); const key=id+"|"+date; if(seen.has(key)) return; seen.add(key); found.push({id,date,val}); });
  return found; }
async function handlePdfFiles(files){
  if(!files||!files.length) return;
  for(const file of files){
    const att={ id:"a"+Date.now()+Math.floor(Math.random()*999), name:file.name, when:new Date().toLocaleDateString("pt-BR"), n:null };
    // guarda base64 (se couber)
    try{ const buf=await file.arrayBuffer(); let bin=""; const bytes=new Uint8Array(buf); for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]); const b64=btoa(bin);
      if(b64.length<3500000){ State.pdfBlobs[att.id]=b64; try{ Store.set("rm_pdf_"+att.id,b64); }catch(e){} }
      // tenta ler texto
      try{ const lib=await ensurePdfJs(); const pdf=await lib.getDocument({data:buf.slice(0)}).promise; let txt="";
        for(let pg=1;pg<=pdf.numPages;pg++){ const page=await pdf.getPage(pg); const c=await page.getTextContent(); txt+=" "+c.items.map(it=>it.str).join(" "); }
        const res=parseLabText(txt); att.n=res.length; res.forEach(r=>{ const p=exById(r.id); if(p) pushPoint(p,r.date,r.val); });
      }catch(e){ att.n=null; att.err=true; }
    }catch(e){}
    State.attach.push(att);
  }
  save();
  renderExames();
  const last=State.attach[State.attach.length-1];
  if(last && last.err){ openSheet(`<h2>PDF anexado</h2><div class="sheet-sub">${esc(last.name)}</div><p style="color:var(--slate);font-size:14px;line-height:1.55">O arquivo foi guardado, mas a leitura automática não rodou neste ambiente (precisa de conexão para carregar o leitor de PDF). No app instalado/hospedado a leitura funciona. Enquanto isso, você pode tocar em <b>Adicionar resultado manualmente</b> para lançar os valores, ou me enviar o PDF no chat que eu já incluo os números.</p><button class="sact primary" style="width:100%;padding:13px" onclick="closeSheet()">Entendi</button>`); }
  else if(last && last.n===0){ openSheet(`<h2>Leitura concluída</h2><div class="sheet-sub">${esc(last.name)}</div><p style="color:var(--slate);font-size:14px;line-height:1.55">Não reconheci parâmetros conhecidos neste laudo (formato diferente). Use <b>Adicionar resultado manualmente</b> ou me mande o PDF no chat para inclusão automática.</p><button class="sact primary" style="width:100%;padding:13px" onclick="closeSheet()">Ok</button>`); }
}
